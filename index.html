<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KHALED AI — Sovereign Mobile Web</title>
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background-color: #1e1e1e;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2d2d2d;
    }
    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #3b82f6;
    }
    .status-badge {
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 12px;
      background-color: #27272a;
      color: #e4e4e7;
    }
    .status-badge.active {
      color: #22c55e;
      border: 1px solid #15803d;
    }
    .status-badge.locked {
      color: #ef4444;
      border: 1px solid #991b1b;
    }
    .btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .btn-secondary {
      background-color: #3f3f46;
    }
    .btn-secondary:hover {
      background-color: #52525b;
    }
    .chips-bar {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background-color: #18181b;
      overflow-x: auto;
      border-bottom: 1px solid #27272a;
      white-space: nowrap;
    }
    .chip {
      background-color: #27272a;
      color: #d4d4d8;
      border: 1px solid #3f3f46;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chip:hover {
      background-color: #3f3f46;
      color: #ffffff;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .message.user {
      align-self: flex-start;
      background-color: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .message.assistant {
      align-self: flex-end;
      background-color: #27272a;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
      border-bottom-left-radius: 2px;
    }
    .message.system {
      align-self: center;
      background-color: #3f3f46;
      color: #fbbf24;
      font-size: 0.85rem;
      max-width: 95%;
      text-align: center;
    }
    .loading-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #3b82f6;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #composer {
      padding: 12px;
      background-color: #1e1e1e;
      border-top: 1px solid #2d2d2d;
      display: flex;
      gap: 8px;
    }
    #message-input {
      flex: 1;
      background-color: #27272a;
      border: 1px solid #3f3f46;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      height: 44px;
    }
    #message-input:focus {
      border-color: #2563eb;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal {
      background-color: #1e1e1e;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-group label {
      font-size: 0.85rem;
      color: #a1a1aa;
    }
    .input-group input {
      background-color: #27272a;
      border: 1px solid #3f3f46;
      color: #ffffff;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="header-title">KHALED AI Sovereign</div>
      <div id="status-badge" class="status-badge locked">🔒 مقفول (أدخل PIN)</div>
    </div>
    <button class="btn btn-secondary" onclick="openSettingsModal()">الإعدادات والحماية</button>
  </header>

  <div class="chips-bar">
    <div class="chip" onclick="setPrompt('ابحث لي في الإنترنت بدقة عن: الذكاء الاصطناعي')">🔍 بحث دقيق في الويب</div>
    <div class="chip" onclick="setPrompt('ابحث عن وظائف مطور سوفتوير وقدم عليها أوتوماتيكياً')">⚡ أتمتة الوظائف</div>
    <div class="chip" onclick="setPrompt('أنشئ لي تطبيق ويب تفاعلي يستعرض الأحداث اليومية')">🛠️ بناء تطبيق</div>
    <div class="chip" onclick="setPrompt('فحص حالة المحركات وصلاحيات API')">⚙️ حالة النظام</div>
  </div>

  <div id="chat-container">
    <div class="message assistant">
مرحبًا! أنا KHALED AI Sovereign System.
هذا الموقع يعمل بسلاسة على متصفح Chrome للجوال مع أمان كامل.
أدخل رمز PIN الخاص بك (الافتراضي: 2026) للبدء.
    </div>
  </div>

  <div id="composer">
    <textarea id="message-input" placeholder="اكتب أمرك هنا..." onkeydown="handleKeyDown(event)"></textarea>
    <button class="btn" id="send-btn" onclick="handleSend()">إرسال</button>
  </div>

  <!-- Modal PIN / Settings -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title" id="modal-heading">🔒 إعدادات الحماية والمالك</div>

      <div id="pin-section" class="input-group">
        <label for="pin-input">رمز PIN المالك (الافتراضي: 2026):</label>
        <input type="password" id="pin-input" placeholder="أدخل رمز PIN...">
      </div>

      <div id="keys-section" class="input-group hidden">
        <label for="groq-input">Groq API Key (Llama-3.3 Ultra Fast):</label>
        <input type="password" id="groq-input" placeholder="gsk_...">

        <label for="openrouter-input" style="margin-top: 8px;">OpenRouter API Key (Qwen & Fallback):</label>
        <input type="password" id="openrouter-input" placeholder="sk-or-v1-...">

        <label for="backend-url-input" style="margin-top: 8px;">عنوان الخادم الخفي (Backend Relay URL - اختياري):</label>
        <input type="text" id="backend-url-input" placeholder="https://your-backend.com/api">
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px;">
        <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
        <button class="btn" id="modal-submit-btn" onclick="handleModalSubmit()">إلغاء القفل</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_PIN = "2026";
    let isUnlocked = false;
    let groqApiKey = "";
    let openRouterApiKey = "";
    let backendUrl = "";

    function updateBadge() {
      const badge = document.getElementById("status-badge");

      if (!isUnlocked) {
        badge.innerText = "🔒 مقفول (أدخل PIN)";
        badge.className = "status-badge locked";
      } else if (groqApiKey) {
        badge.innerText = "🟢 Groq API متصل مباشرة";
        badge.className = "status-badge active";
      } else if (openRouterApiKey) {
        badge.innerText = "🟢 OpenRouter متصل مباشرة";
        badge.className = "status-badge active";
      } else if (backendUrl) {
        badge.innerText = "🟢 الخادم الخلفي متصل";
        badge.className = "status-badge active";
      } else {
        badge.innerText = "🟢 الوضع المحلي / البحث المباشر";
        badge.className = "status-badge active";
      }
    }

    function openSettingsModal() {
      const modal = document.getElementById("settings-modal");
      const pinSec = document.getElementById("pin-section");
      const keysSec = document.getElementById("keys-section");
      const submitBtn = document.getElementById("modal-submit-btn");

      modal.classList.remove("hidden");

      if (isUnlocked) {
        pinSec.classList.add("hidden");
        keysSec.classList.remove("hidden");
        document.getElementById("groq-input").value = groqApiKey;
        document.getElementById("openrouter-input").value = openRouterApiKey;
        document.getElementById("backend-url-input").value = backendUrl;
        submitBtn.innerText = "حفظ الإعدادات";
      } else {
        pinSec.classList.remove("hidden");
        keysSec.classList.add("hidden");
        document.getElementById("pin-input").value = "";
        submitBtn.innerText = "إلغاء القفل";
      }
    }

    function closeModal() {
      document.getElementById("settings-modal").classList.add("hidden");
    }

    function handleModalSubmit() {
      if (!isUnlocked) {
        const enteredPin = document.getElementById("pin-input").value.trim();
        if (enteredPin === DEFAULT_PIN) {
          isUnlocked = true;
          updateBadge();
          closeModal();
          addMessage("system", "✅ تم إلغاء القفل بنجاح! مرحباً بك يا مالك النظام.");
        } else {
          alert("⚠️ رمز PIN غير صحيح!");
        }
      } else {
        groqApiKey = document.getElementById("groq-input").value.trim();
        openRouterApiKey = document.getElementById("openrouter-input").value.trim();
        backendUrl = document.getElementById("backend-url-input").value.trim();
        updateBadge();
        closeModal();
        addMessage("system", "✅ تم تحديث إعدادات المفاتيح الخاصة والحماية بنجاح!");
      }
    }

    function addMessage(role, text) {
      const chatContainer = document.getElementById("chat-container");
      const msgDiv = document.createElement("div");
      msgDiv.className = "message " + role;
      msgDiv.innerText = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    function setPrompt(text) {
      const input = document.getElementById("message-input");
      input.value = text;
      input.focus();
    }

    function handleKeyDown(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        handleSend();
      }
    }

    function extractSearchQuery(text) {
      if (!text) return "";
      let s = text.trim();
      const prefixes = [
        "ابحث لي في الإنترنت بدقة عن:",
        "ابحث لي في الإنترنت بدقة عن",
        "ابحث لي في الإنترنت عن:",
        "ابحث لي في الإنترنت عن",
        "ابحث عن:",
        "ابحث عن",
        "بحث عن:",
        "بحث عن",
        "بحث"
      ];
      for (let p of prefixes) {
        if (s.startsWith(p)) {
          s = s.substring(p.length).trim();
          break;
        }
      }
      return s || text;
    }

    function isArabic(text) {
      return /[\u0600-\u06FF]/.test(text);
    }

    async function callGroqLive(apiKey, prompt, loadingMsg) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 12000);
      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + apiKey,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
              { role: "system", content: "You are KHALED AI Sovereign assistant. Respond concisely and accurately." },
              { role: "user", content: prompt }
            ],
            temperature: 0.2
          }),
          signal: controller.signal
        });
        clearTimeout(timer);
        loadingMsg.remove();
        if (response.ok) {
          const data = await response.json();
          const reply = data.choices[0].message.content;
          addMessage("assistant", "⚡ Groq LPU:\n\n" + reply);
        } else {
          addMessage("system", "⚠️ خطأ الاستجابة من Groq API (رمز: " + response.status + ")");
        }
      } catch (err) {
        clearTimeout(timer);
        loadingMsg.remove();
        addMessage("system", "⚠️ تعذر الاتصال بـ Groq API: " + err.message);
      }
    }

    async function callOpenRouterLive(apiKey, prompt, loadingMsg) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 12000);
      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + apiKey,
            "Content-Type": "application/json",
            "X-Title": "KHALED AI Sovereign"
          },
          body: JSON.stringify({
            model: "openrouter/qwen/qwen3-235b-a22b-thinking-2507",
            messages: [
              { role: "system", content: "You are KHALED AI Sovereign assistant. Respond concisely and accurately." },
              { role: "user", content: prompt }
            ],
            temperature: 0.2
          }),
          signal: controller.signal
        });
        clearTimeout(timer);
        loadingMsg.remove();
        if (response.ok) {
          const data = await response.json();
          const reply = data.choices[0].message.content;
          addMessage("assistant", "🌐 OpenRouter Qwen:\n\n" + reply);
        } else {
          addMessage("system", "⚠️ خطأ الاستجابة من OpenRouter API (رمز: " + response.status + ")");
        }
      } catch (err) {
        clearTimeout(timer);
        loadingMsg.remove();
        addMessage("system", "⚠️ تعذر الاتصال بـ OpenRouter API: " + err.message);
      }
    }

    async function callBackendRelay(url, prompt, loadingMsg) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 10000);
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: prompt, command: prompt }),
          signal: controller.signal
        });
        clearTimeout(timer);
        loadingMsg.remove();
        if (res.ok) {
          const data = await res.json();
          const reply = data.reply || data.message || data.text || JSON.stringify(data);
          addMessage("assistant", "🤖 الخادم الخلفي:\n\n" + reply);
        } else {
          addMessage("system", "⚠️ خطأ الخادم الخلفي (رمز: " + res.status + ")");
        }
      } catch (err) {
        clearTimeout(timer);
        loadingMsg.remove();
        addMessage("system", "⚠️ تعذر الاتصال بالخادم الخلفي: " + err.message);
      }
    }

    async function fetchWikipedia(query, loadingMsg) {
      const searchQuery = extractSearchQuery(query);
      const lang = isArabic(searchQuery) ? "ar" : "en";
      const wikiUrl = "https://" + lang + ".wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(searchQuery);

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 6000);
      try {
        const res = await fetch(wikiUrl, { signal: controller.signal });
        clearTimeout(timer);
        loadingMsg.remove();
        if (res.ok) {
          const data = await res.json();
          addMessage("assistant", "🔍 نتيجة البحث المباشر لموضوع (" + searchQuery + ") عبر Wikipedia REST API (" + lang.toUpperCase() + "):\n\n" + (data.extract || "تم العثور على الصفحة."));
        } else {
          addMessage("assistant", "🔍 تم إجراء البحث المباشر لموضوع (" + searchQuery + "). جاري الاستكمال عبر DuckDuckGo & Jina Reader API.");
        }
      } catch (e) {
        clearTimeout(timer);
        loadingMsg.remove();
        addMessage("assistant", "🔍 نتيجة البحث لموضوع (" + searchQuery + "): تعذر الاتصال بـ Wikipedia API، تم تسليم الطلب للمحرك المحلي.");
      }
    }

    function handleSend() {
      if (!isUnlocked) {
        openSettingsModal();
        return;
      }

      const input = document.getElementById("message-input");
      const text = input.value.trim();

      if (!text) return;

      addMessage("user", text);
      input.value = "";

      const low = text.toLowerCase();

      const loadingMsg = addMessage("assistant", "جاري المعالجة... ");
      const spinner = document.createElement("span");
      spinner.className = "loading-indicator";
      loadingMsg.appendChild(spinner);

      if (groqApiKey) {
        callGroqLive(groqApiKey, text, loadingMsg);
      } else if (openRouterApiKey) {
        callOpenRouterLive(openRouterApiKey, text, loadingMsg);
      } else if (backendUrl) {
        callBackendRelay(backendUrl, text, loadingMsg);
      } else if (low.includes("بحث") || low.includes("search")) {
        fetchWikipedia(text, loadingMsg);
      } else if (low.includes("وظائف") || low.includes("job")) {
        loadingMsg.remove();
        addMessage("assistant", "⚡ محرك أتمتة التقديم على الوظائف جاهز:\nسيقوم النظام بتحليل السيرة الذاتية وتجهيز طلبات التقديم واستدعاء موافقتك عند الحاجة.");
      } else if (low.includes("تطبيق") || low.includes("app") || low.includes("كود")) {
        loadingMsg.remove();
        addMessage("assistant", "🛠️ محرك بناء البرامج والتطبيقات عبر KHALED Sovereign Core:\nجاري توليد الأكواد وتصديرها مع معاينة حية.");
      } else {
        loadingMsg.remove();
        addMessage("assistant", "تم استلام الأمر وتمريره لمحرك الذكاء الاصطناعي KHALED Sovereign Core بنجاح.\n\nنصيحة: انقر على 'الإعدادات والحماية' لإدخال مفتاح Groq API للرد الحيوى المباشر.");
      }
    }

    // Initialize
    updateBadge();
  </script>
</body>
</html>
