verification-agent:name: "10 • Final Verification Gate"needs:- orchestrator- repository-auditor- workflow-debugger- build-agent- test-agent- security-agent- static-reviewer- browser-verifierif: always()runs-on: ubuntu-latesttimeout-minutes: 10

steps:
  - uses: actions/checkout@v4

  - name: Evaluate evidence
    shell: bash
    run: |
      set -Eeuo pipefail

      declare -A RESULTS=(
        [orchestrator]="${{ needs.orchestrator.result }}"
        [repository-auditor]="${{ needs.repository-auditor.result }}"
        [workflow-debugger]="${{ needs.workflow-debugger.result }}"
        [build-agent]="${{ needs.build-agent.result }}"
        [test-agent]="${{ needs.test-agent.result }}"
        [security-agent]="${{ needs.security-agent.result }}"
        [static-reviewer]="${{ needs.static-reviewer.result }}"
        [browser-verifier]="${{ needs.browser-verifier.result }}"
      )

      FAILED=0

      for JOB in "${!RESULTS[@]}"; do
        echo "${JOB}=${RESULTS[$JOB]}"

        case "${RESULTS[$JOB]}" in
          success|skipped)
            ;;
          *)
            FAILED=1
            ;;
        esac
      done

      mkdir -p artifacts/final

      {
        echo "KHALED FACTORY FINAL REPORT"
        echo "==========================="
        echo "Repository: ${GITHUB_REPOSITORY}"
        echo "Commit: ${GITHUB_SHA}"
        echo "Run: ${GITHUB_RUN_ID}"
        echo
        for JOB in "${!RESULTS[@]}"; do
          echo "${JOB}: ${RESULTS[$JOB]}"
        done
      } > artifacts/final/report.txt

      if (( FAILED != 0 )); then
        echo "FINAL_STATUS=FAIL" >> artifacts/final/report.txt
        echo "::error::KHALED Factory verification gate FAILED."
        exit 1
      fi

      echo "FINAL_STATUS=PASS" >> artifacts/final/report.txt
      echo "KHALED Factory verification gate PASSED."

  - uses: actions/upload-artifact@v4
    if: always()
    with:
      name: KHALED-FINAL-EVIDENCE-${{ github.run_id }}
      path: artifacts/final/
      if-no-files-found: error

