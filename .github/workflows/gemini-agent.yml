name: Gemini Self Repair

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Self-repair Gemini Agent infrastructure"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  self-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Git identity
        run: |
          git config user.name "Gemini Self Repair"
          git config user.email "gemini-self-repair@users.noreply.github.com"

      - name: Gemini Self Repair
        uses: google-github-actions/run-gemini-cli@v0
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: "0.58.0"
          prompt: |
            SELF-REPAIR MODE ONLY.

            Your only mission is to repair the Gemini GitHub Actions
            infrastructure of this repository.

            DO NOT develop KHALED.
            DO NOT develop REVO AI.
            DO NOT modify application functionality.

            First inspect:
            - .github/workflows/
            - .github/workflows/gemini-agent.yml
            - GEMINI.md
            - KHALED-MASTER-PLAN.md
            - git history
            - current git status

            The current Gemini workflow may be corrupted or contain the
            wrong file content.

            Diagnose the actual problem.

            Repair the Gemini workflow itself.

            Ensure:
            - valid YAML
            - correct GitHub Actions syntax
            - correct Gemini CLI action
            - trusted workspace configuration
            - GEMINI_API_KEY wiring
            - correct permissions
            - deterministic Gemini CLI version
            - checkout configuration
            - Git configuration
            - safe timeout
            - no duplicated/conflicting Gemini workflow
            - correct separation between GEMINI.md and workflow files

            Preserve GEMINI.md as a separate instruction document.

            After repairing:
            1. Validate the YAML.
            2. Inspect the final workflow.
            3. Inspect git diff.
            4. Check for accidental corruption.
            5. Check for secrets.
            6. Commit the repair if the repair is valid.

            Do not modify application source code.

            Do not claim VERIFIED unless the repair was actually validated.

            Final report:
            ROOT CAUSE
            FILES CHANGED
            REPAIR
            VALIDATION
            REMAINING BLOCKERS
            STATUS

      - name: Final validation
        if: always()
        run: |
          echo "=== STATUS ==="
          git status --short
          echo "=== WORKFLOW ==="
          sed -n '1,220p' .github/workflows/gemini-agent.yml
          echo "=== COMMIT ==="
          git rev-parse HEAD
