name: BrowserStack Real Android Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  browserstack-real-android:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # DEBUG REPOSITORY STRUCTURE
      # ------------------------------------------------------
      - name: Inspect Android project
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== ROOT ==="
          pwd

          echo "=== TOP LEVEL ==="
          find . -maxdepth 2 -type f \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \
            -o -name "*.apk" \
            -print

          echo "=== ANDROID DIRECTORIES ==="
          find . -maxdepth 3 -type d \
            -name "android_app" \
            -o -name "khaled_android" \
            -o -name "app" \
            -print

      # ------------------------------------------------------
      # JAVA
      # ------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ------------------------------------------------------
      # ANDROID SDK
      # ------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------
      # BUILD ANDROID APP 1
      # ------------------------------------------------------
      - name: Build android_app APK
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d "android_app" ]; then
            echo "ERROR: android_app directory not found."
            find . -maxdepth 3 -type f | head -300
            exit 1
          fi

          cd android_app

          if [ ! -f "gradlew" ]; then
            echo "ERROR: android_app/gradlew not found."
            ls -la
            exit 1
          fi

          chmod +x gradlew

          echo "=== GRADLE VERSION ==="
          ./gradlew --version

          echo "=== BUILD ==="
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

          echo "=== APK ==="
          find app/build/outputs -type f -name "*.apk" -print

      # ------------------------------------------------------
      # BUILD ANDROID APP 2
      # ------------------------------------------------------
      - name: Build khaled_android APK
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d "khaled_android" ]; then
            echo "ERROR: khaled_android directory not found."
            find . -maxdepth 3 -type f | head -300
            exit 1
          fi

          cd khaled_android

          if [ ! -f "gradlew" ]; then
            echo "ERROR: khaled_android/gradlew not found."
            ls -la
            exit 1
          fi

          chmod +x gradlew

          echo "=== GRADLE VERSION ==="
          ./gradlew --version

          echo "=== BUILD ==="
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

          echo "=== APK ==="
          find app/build/outputs -type f -name "*.apk" -print

      # ------------------------------------------------------
      # APK VALIDATION
      # ------------------------------------------------------
      - name: Validate APKs
        shell: bash
        run: |
          set -euxo pipefail

          test -f android_app/app/build/outputs/apk/debug/app-debug.apk
          test -f khaled_android/app/build/outputs/apk/debug/app-debug.apk

          ls -lh \
            android_app/app/build/outputs/apk/debug/app-debug.apk \
            khaled_android/app/build/outputs/apk/debug/app-debug.apk

      # ------------------------------------------------------
      # BROWSERSTACK CREDENTIAL CHECK
      # ------------------------------------------------------
      - name: Validate BrowserStack credentials
        shell: bash
        run: |
          set -e

          test -n "$BROWSERSTACK_USERNAME"
          test -n "$BROWSERSTACK_ACCESS_KEY"

          echo "BrowserStack credentials detected."

      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------
      - name: Install Appium client
        shell: bash
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            appium-python-client \
            requests

      # ------------------------------------------------------
      # BROWSERSTACK REAL DEVICE TEST
      # ------------------------------------------------------
      - name: Run BrowserStack real Android test
        shell: bash
        run: |

          cat > browserstack_real_test.py <<'PY'

          import os
          import sys
          import time
          import requests

          from appium import webdriver
          from appium.options.android import UiAutomator2Options


          USER = os.environ["BROWSERSTACK_USERNAME"]
          KEY = os.environ["BROWSERSTACK_ACCESS_KEY"]

          API = "https://api-cloud.browserstack.com"


          def upload_apk(path):

              print("Uploading APK:", path)

              with open(path, "rb") as f:

                  r = requests.post(
                      API + "/app-automate/upload",
                      auth=(USER, KEY),
                      files={
                          "file": (
                              os.path.basename(path),
                              f,
                              "application/vnd.android.package-archive"
                          )
                      },
                      timeout=180
                  )

              print("Upload HTTP:", r.status_code)

              r.raise_for_status()

              data = r.json()

              if "app_url" not in data:
                  raise RuntimeError(
                      "BrowserStack did not return app_url: "
                      + str(data)
                  )

              return data["app_url"]


          def get_devices():

              r = requests.get(
                  API + "/app-automate/devices.json",
                  auth=(USER, KEY),
                  timeout=30
              )

              print("Device API HTTP:", r.status_code)

              r.raise_for_status()

              return r.json()


          def choose_device():

              devices = get_devices()

              real_android = [
                  d for d in devices
                  if str(d.get("os", "")).lower() == "android"
                  and d.get("realMobile") is True
              ]

              if not real_android:
                  raise RuntimeError(
                      "No real Android device was returned by BrowserStack."
                  )

              # Prefer widely available devices.
              preferred = [
                  "Google Pixel 7",
                  "Google Pixel 6",
                  "Google Pixel 5",
                  "Samsung Galaxy S22",
                  "Samsung Galaxy S21"
              ]

              for p in preferred:
                  for d in real_android:
                      if d.get("device") == p:
                          return d

              return real_android[0]


          def run_test(apk, name):

              device = choose_device()

              print()
              print("======================================")
              print("APP:", name)
              print("DEVICE:", device.get("device"))
              print("OS:", device.get("os_version"))
              print("REAL:", device.get("realMobile"))
              print("======================================")

              app_url = upload_apk(apk)

              options = UiAutomator2Options()

              options.set_capability(
                  "platformName",
                  "Android"
              )

              options.set_capability(
                  "appium:automationName",
                  "UiAutomator2"
              )

              options.set_capability(
                  "appium:deviceName",
                  device["device"]
              )

              options.set_capability(
                  "appium:platformVersion",
                  str(device["os_version"])
              )

              options.set_capability(
                  "appium:app",
                  app_url
              )

              options.set_capability(
                  "bstack:options",
                  {
                      "userName": USER,
                      "accessKey": KEY,
                      "projectName": "Gooddaygoobuy",
                      "buildName": "Real Android",
                      "sessionName": name,
                      "debug": True,
                      "networkLogs": True,
                      "video": True,
                      "appiumLogs": True
                  }
              )

              driver = None

              try:

                  driver = webdriver.Remote(
                      "https://hub-cloud.browserstack.com/wd/hub",
                      options=options
                  )

                  print("REAL DEVICE SESSION STARTED")

                  time.sleep(8)

                  screenshot = name + "_screenshot.png"

                  driver.save_screenshot(
                      screenshot
                  )

                  with open(
                      name + "_ui.xml",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(driver.page_source)

                  print("Evidence captured.")
                  print("TEST PASSED:", name)

              finally:

                  if driver:

                      try:
                          driver.quit()
                      except Exception:
                          pass


          tests = [
              (
                  "android_app/app/build/outputs/apk/debug/app-debug.apk",
                  "android_app"
              ),
              (
                  "khaled_android/app/build/outputs/apk/debug/app-debug.apk",
                  "khaled_android"
              )
          ]


          failed = []

          for apk, name in tests:

              try:

                  if not os.path.isfile(apk):
                      raise RuntimeError(
                          "APK not found: " + apk
                      )

                  run_test(apk, name)

              except Exception as e:

                  print()
                  print("FAILED:", name)
                  print(type(e).__name__)
                  print(str(e))

                  failed.append(name)


          if failed:

              print()
              print("FAILED APPS:", failed)
              sys.exit(1)


          print()
          print("======================================")
          print("ALL REAL DEVICE TESTS PASSED")
          print("======================================")

          PY

          python browserstack_real_test.py

      # ------------------------------------------------------
      # EVIDENCE
      # ------------------------------------------------------
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-real-android-evidence
          path: |
            *_screenshot.png
            *_ui.xml
          if-no-files-found: warn
          retention-days: 7
