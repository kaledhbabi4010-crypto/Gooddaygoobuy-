name: KHALED - REAL Gemini Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-smoke:
    runs-on: ubuntu-latest

    env:
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reviewer dependencies
        working-directory: .khaled/ai-code-reviewer
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify secret injection without exposing value
        shell: bash
        run: |
          if [ -z "${GOOGLE_API_KEY:-}" ]; then
            echo "❌ GEMINI_API_KEY was not injected into GOOGLE_API_KEY"
            exit 1
          fi

          echo "✅ Gemini secret is injected"
          echo "Key length is ${#GOOGLE_API_KEY} characters"
          echo "The secret value itself will NOT be printed."

      - name: Real Gemini API call through project GoogleProvider
        env:
          PYTHONPATH: .khaled/ai-code-reviewer
        run: |
          python - <<'PY'
          import asyncio
          import os
          import sys

          sys.path.insert(0, ".khaled/ai-code-reviewer")

          from src.providers.google_provider import GoogleProvider

          async def main():
              key = os.environ.get("GOOGLE_API_KEY", "")
              model = os.environ.get("GEMINI_MODEL", "gemini-2.5-flash")

              if not key:
                  raise RuntimeError("GOOGLE_API_KEY is empty")

              provider = GoogleProvider(
                  api_key=key,
                  model=model,
              )

              print("PROVIDER =", provider.name)
              print("MODEL =", model)
              print("CALLING GEMINI = TRUE")

              result = await provider.complete(
                  messages=[
                      {
                          "role": "system",
                          "content": (
                              "You are a connectivity test. "
                          ),
                      },
                      {
                          "role": "user",
                          "content": "Reply with a short confirmation that Gemini is reachable.",
                      },
                  ],
                  temperature=0,
                  max_tokens=100,
                  reasoning_effort="minimal",
              )

              text = (result.content or "").strip()

              print("API RESPONSE RECEIVED = TRUE")
              print("RESPONSE =", text[:200])
              print("INPUT TOKENS =", result.input_tokens)
              print("OUTPUT TOKENS =", result.output_tokens)


              if not text or not text.strip():
                  raise RuntimeError("Gemini API returned an empty response.")

              print("REAL GEMINI RESPONSE = NON_EMPTY")
              print("REAL GEMINI SMOKE TEST = PASSED")


          asyncio.run(main())
          PY

      - name: Failure marker
        if: failure()
        run: |
          echo "❌ REAL GEMINI SMOKE TEST = FAILED"
          echo "No Gemini success will be claimed."
