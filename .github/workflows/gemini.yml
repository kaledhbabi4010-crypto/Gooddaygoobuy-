name: Gemini AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "اكتب مهمة Gemini هنا"
        required: true
        type: string

  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  gemini:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@gemini-cli')
      )

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Read GEMINI.md and KHALED-MASTER-PLAN.md first.

            Work as an autonomous senior software engineering team.

            Analyze the repository before making changes.
            Implement the highest-priority missing functionality.
            Build the project.
            Run all available tests.
            Diagnose failures.
            Fix failures.
            Build and test again.
            Repeat until the available automated work is exhausted.

            STRICT REQUIREMENTS:
            - Never invent results.
            - Never claim success without real evidence.
            - Never convert NOT_VERIFIED to VERIFIED without evidence.
            - Never fabricate Autodesk, Revit, or AutoCAD tests.
            - Preserve working functionality.
            - Do not weaken tests to obtain PASS.
            - Do not expose secrets.
            - Minimize unnecessary model calls.
            - Use existing scripts whenever possible.

            USER TASK:
            ${{ github.event.inputs.task || github.event.comment.body }}

            FINAL REPORT:
            Changed files:
            Build:
            Tests:
            Verification:
            Evidence:
            Remaining blockers:
