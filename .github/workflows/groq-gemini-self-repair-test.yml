name: KHALED - Workflow Auto Detect and Repair

on:
  push:
    branches:
      - groq-real-repair-test
      - main
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install actionlint validator
        run: |
          cd /tmp
          curl -sSL -o download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
          bash ./download-actionlint.bash latest

      - name: Detect defects in all workflows
        id: detect
        run: |
          set -euo pipefail
          /tmp/actionlint -no-color .github/workflows/*.yml > /tmp/actionlint-report.txt 2>&1 || true
          if [ -s /tmp/actionlint-report.txt ]; then
            echo "defects=true" >> "$GITHUB_OUTPUT"
            echo "=== DEFECTS DETECTED ==="
            cat /tmp/actionlint-report.txt
          else
            echo "defects=false" >> "$GITHUB_OUTPUT"
            echo "ALL WORKFLOWS VALID"
          fi

      - name: Run Groq repair
        if: steps.detect.outputs.defects == 'true'
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check groq

          {
            cat <<'EOF'
          Fix the GitHub Actions workflow defects reported by actionlint below.

          Rules:
          - Repair ONLY the .github/workflows/*.yml files named in the report.
          - Use the smallest justified changes that resolve the reported defects.
          - Do NOT modify any other files.
          - Do NOT rebuild the project and do NOT run the full test suite.
          - Report VERIFIED_FIXED only with actual evidence.
            Otherwise report UNABLE_TO_VERIFY.

          actionlint report:
          EOF
            cat /tmp/actionlint-report.txt
          } > /tmp/repair-prompt.txt

          python3 .github/scripts/smart_maintenance.py "$(cat /tmp/repair-prompt.txt)"

      - name: Verify only workflows changed
        id: verify
        if: always() && steps.detect.outputs.defects == 'true'
        run: |
          set -euo pipefail
          echo "=== GIT STATUS ==="
          git status --short -- . ':!.groq-repair/'
          OTHER=$(git status --porcelain -- . ':!.groq-repair/' | grep -v "\.github/workflows/" || true)
          if [ -n "$OTHER" ]; then
            echo "ERROR: OTHER FILES MODIFIED"
            echo "$OTHER"
            exit 50
          fi

      - name: Commit and push repair
        if: always() && steps.detect.outputs.defects == 'true' && steps.verify.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- . ':!.groq-repair/')" ]; then
            echo "NOTHING_TO_COMMIT"
            exit 0
          fi
          git config user.name "groq-repair-bot"
          git config user.email "actions@github.com"
          git checkout - 2>/dev/null || true
          git add -- .github/workflows
          git commit -m "fix: auto-repair workflow defects [skip ci]"
          git push

      - name: Final validation
        if: always()
        run: |
          set -euo pipefail
          /tmp/actionlint -no-color .github/workflows/*.yml > /tmp/new-report.txt 2>&1 || true
          OLD=$(grep -cE ':[0-9]+:[0-9]+: ' /tmp/actionlint-report.txt || true)
          NEW=$(grep -cE ':[0-9]+:[0-9]+: ' /tmp/new-report.txt || true)
          echo "ERRORS_BEFORE=$OLD"
          echo "ERRORS_AFTER=$NEW"
          if [ "$NEW" -eq 0 ] && [ "$OLD" -eq 0 ]; then
            echo "RESULT=ALL_VALID"
          elif [ "$NEW" -eq 0 ]; then
            echo "RESULT=ALL_DEFECTS_FIXED"
          elif [ "$NEW" -lt "$OLD" ]; then
            echo "RESULT=PROGRESS_MADE"
          else
            echo "RESULT=NO_IMPROVEMENT"
            exit 51
          fi
