name: KHALED GROQ REAL REPAIR

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run KHALED Groq Real Repair
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
          GROQ_MAX_ROUNDS: "6"
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check groq
          python3 .github/scripts/smart_maintenance.py

      - name: Upload Repair Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groq-repair-evidence
          path: .groq-repair/
          if-no-files-found: warn
