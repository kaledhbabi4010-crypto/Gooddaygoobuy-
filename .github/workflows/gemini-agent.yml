name: Gemini Self Repair

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: google-github-actions/run-gemini-cli@v0
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GH_WORKFLOW_PAT }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: "0.58.0"
          prompt: |
            SELF-REPAIR ONLY.

            Repair the Gemini GitHub Actions infrastructure.

            Inspect all files in .github/workflows,
            GEMINI.md, KHALED-MASTER-PLAN.md and git history.

            Repair invalid YAML, duplicate Gemini workflows,
            permissions, authentication, checkout, Git configuration,
            Gemini CLI configuration, trust configuration and workflow
            conflicts.

            Do NOT develop KHALED.
            Do NOT develop REVO AI.
            Do NOT modify application functionality.

            Validate everything after repairing.

            Inspect git diff before committing.

            If valid, commit and push the repair.

            Never fabricate verification.

            Final status:
            VERIFIED / FAILED / NOT_VERIFIED / BLOCKED
