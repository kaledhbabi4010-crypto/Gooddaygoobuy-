name: Gemini AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Gemini"
        required: true
        type: string

  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  gemini:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@gemini-cli')
      )

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are the lead autonomous engineer for this repository.

            FIRST:
            - Read GEMINI.md completely.
            - Read KHALED-MASTER-PLAN.md completely.
            - Inspect the entire repository before changing important code.
            - Understand the existing architecture and tests.

            MISSION:
            Continue implementing the KHALED / REVO AI project toward the
            requirements defined in KHALED-MASTER-PLAN.md.

            EXECUTION LOOP:
            1. Analyze.
            2. Plan.
            3. Implement.
            4. Build.
            5. Test.
            6. Diagnose failures.
            7. Repair.
            8. Build again.
            9. Test again.
            10. Verify.
            11. Repeat until no useful automated work remains.

            QUALITY RULES:
            - Never fabricate results.
            - Never claim a test passed unless it actually passed.
            - Never claim Autodesk/Revit/AutoCAD functionality is verified
              unless real evidence exists.
            - NEVER convert NOT_VERIFIED into VERIFIED without evidence.
            - Preserve existing working functionality.
            - Do not weaken tests just to obtain PASS.
            - Do not delete required functionality to make builds pass.
            - Prefer small, verifiable changes.
            - Use existing repository scripts whenever possible.
            - Minimize unnecessary model calls.
            - Reuse repository context whenever possible.
            - Fix errors instead of hiding them.
            - Keep the project buildable after changes.

            SAFETY:
            - Do not expose secrets.
            - Do not print API keys.
            - Do not commit credentials.
            - Do not make destructive changes without necessity.

            EVIDENCE:
            Every claimed success must have actual evidence from commands,
            tests, builds, or repository state.

            FINAL REPORT:
            Report only:
            - files changed
            - build status
            - test status
            - verification status
            - real evidence
            - remaining blockers

            USER TASK:
            ${{ github.event.inputs.task || github.event.comment.body }}
