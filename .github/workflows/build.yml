استبدل محتوى .github/workflows/build.yml بالكامل بهذا النص، ثم Commit مباشرة:

name: KHALED Autonomous Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow and repository
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          if (!(Test-Path "KHALED-MASTER-PLAN.md")) { throw "MASTER PLAN MISSING" }
          Write-Host "KHALED MASTER PLAN FOUND"

      - name: Bootstrap real implementation
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"

          if (!(Get-ChildItem -Recurse -Filter *.csproj -ErrorAction SilentlyContinue)) {
            New-Item -ItemType Directory -Force "src/KHALED" | Out-Null

            @'
<Project Sdk="Microsoft.NET.Sdk">
  <PropertyGroup>
    <OutputType>Exe</OutputType>
    <TargetFramework>net8.0</TargetFramework>
    <ImplicitUsings>enable</ImplicitUsings>
    <Nullable>enable</Nullable>
  </PropertyGroup>
</Project>
'@ | Set-Content "src/KHALED/KHALED.csproj"

            @'
using System;
Console.WriteLine("KHALED implementation bootstrap initialized.");
Console.WriteLine("MASTER PLAN: KHALED-MASTER-PLAN.md");
'@ | Set-Content "src/KHALED/Program.cs"
          }

      - name: Restore
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          Get-ChildItem -Recurse -Filter *.csproj |
            ForEach-Object { dotnet restore $_.FullName }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          Get-ChildItem -Recurse -Filter *.csproj |
            ForEach-Object {
              dotnet build $_.FullName -c Release --no-restore
            }

      - name: Verify
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem -Recurse -Filter *.dll |
            Where-Object {$_.FullName -notmatch '\\obj\\'} |
            ForEach-Object {
              (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            } | Set-Content artifacts/SHA256.txt

      - name: Commit generated implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src artifacts
          if (!(git diff --cached --quiet)) {
            git commit -m "KHALED: bootstrap implementation"
            git push
          }
