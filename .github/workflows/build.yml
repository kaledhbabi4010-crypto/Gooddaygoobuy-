# KHALED AUTONOMOUS SOFTWARE FACTORY

## PRIMARY OBJECTIVE

Transform the existing repository into the REAL KHALED project described by:

`KHALED-MASTER-PLAN.md`

Do not create a demonstration project.

Do not create fake implementations.

Do not claim that a component works unless it has actual evidence.

The repository, compiler output, test output and generated artifacts are the sources of truth.

---

# 1. FIRST ACTION: COMPLETE REPOSITORY AUDIT

Before modifying anything:

1. Inspect the complete repository tree.
2. Read `KHALED-MASTER-PLAN.md` completely.
3. Inspect all existing source files.
4. Inspect all tests.
5. Inspect all project files.
6. Inspect all workflows.
7. Inspect recent commits.
8. Inspect failed GitHub Actions runs.
9. Determine the actual current implementation state.

Do not assume that previous instructions were executed.

Do not assume that previous generated files exist.

Do not trust documentation when the repository contradicts it.

---

# 2. DETECT THE CURRENT FAILURE

Inspect GitHub Actions.

For every failed run:

- obtain the exact workflow error;
- identify the failing file;
- identify the failing line;
- classify the failure;
- determine whether the failure is configuration, syntax, dependency, environment, implementation or test related.

If `.github/workflows/build.yml` is invalid or is merely text instead of YAML:

do not repeatedly attempt to repair it as if it were a valid product workflow.

Replace it with a deterministic workflow only when required.

Do not delete useful project information.

---

# 3. ARCHITECT AGENT

Create an implementation architecture from the master plan.

Extract:

- requirements
- modules
- interfaces
- dependencies
- build targets
- test targets
- external systems
- unsupported environments
- risks
- acceptance criteria

Resolve duplicate requirements conservatively.

Never silently remove a requirement.

Create an implementation backlog.

Break large work into small independently testable tasks.

---

# 4. RESEARCH AGENT

Research current authoritative technical information when needed.

Priority:

1. official documentation
2. official GitHub repositories
3. official SDK/API documentation
4. authoritative technical sources
5. community sources only when necessary

Verify current APIs and package versions.

Do not invent APIs.

Do not use obsolete examples when a current official API exists.

Record important external findings in evidence.

---

# 5. IMPLEMENTATION AGENT

Implement the real project incrementally.

Rules:

- inspect before editing;
- preserve existing valid work;
- use the smallest safe change;
- avoid speculative architecture;
- avoid fake integrations;
- avoid hard-coded secrets;
- avoid credentials in files;
- add tests for important behavior;
- maintain clear interfaces.

After each meaningful component:

BUILD → TEST → VERIFY

---

# 6. MULTI-AGENT SPECIALIZATION

Use specialized reasoning roles.

## ARCHITECT

Designs the implementation.

## RESEARCHER

Finds authoritative current information.

## CODER

Implements the code.

## BUILDER

Runs the actual build.

## TESTER

Runs actual tests.

## DEBUGGER

Analyzes actual failures.

## REPAIRER-A

Attempts the smallest source-level repair.

## REPAIRER-B

Attempts dependency/API repair.

## REPAIRER-C

Attempts architectural repair.

## SECURITY AGENT

Performs adversarial security analysis.

## BROWSER AGENT

Performs real browser verification.

## REVIEWER

Independently reviews the result.

## VERIFIER

Checks evidence and determines whether claims are actually proven.

Do not allow independent repair agents to overwrite each other blindly.

