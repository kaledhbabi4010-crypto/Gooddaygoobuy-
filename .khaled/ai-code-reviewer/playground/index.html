<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة KHALED AI الذكية</title>
    <!-- Highlight.js & FontAwesome for Code Syntax & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --sidebar-bg: #0b1120;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --user-msg: #2563eb;
            --ai-msg: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .new-chat-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .new-chat-btn:hover { background: var(--accent-hover); }

        .session-list {
            margin-top: 20px;
            flex: 1;
            overflow-y: auto;
        }
        .session-item {
            padding: 10px 12px;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            margin-bottom: 6px;
            font-size: 0.9rem;
            transition: 0.2s;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-item.active, .session-item:hover {
            background: var(--panel-bg);
            color: var(--text-main);
        }

        /* Main Chat Area */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: var(--panel-bg);
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            background: #065f46;
            color: #34d399;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }
        .message-row.user { align-self: flex-start; }
        .message-row.assistant { align-self: flex-end; }

        .message-header {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            border: 1px solid var(--border);
        }
        .message-row.user .message-bubble {
            background: var(--user-msg);
            color: white;
            border: none;
        }
        .message-row.assistant .message-bubble {
            background: var(--ai-msg);
            color: var(--text-main);
        }

        /* Tools Display Box */
        .tool-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #38bdf8;
        }

        /* Code & Pre */
        pre {
            background: #090d16;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
            position: relative;
        }
        code { font-family: monospace; }

        .copy-btn {
            position: absolute;
            top: 6px;
            left: 6px;
            background: #334155;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* Composer Bar */
        .composer {
            padding: 16px 24px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-box {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        .input-box:focus { border-color: var(--accent); }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .send-btn:hover { background: var(--accent-hover); }

        .tool-buttons {
            display: flex;
            gap: 8px;
            padding: 8px 24px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border);
        }
        .tool-chip {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .tool-chip:hover { color: white; border-color: var(--accent); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">🤖 منصة KHALED AI</div>
        <button class="new-chat-btn" onclick="startNewChat()">+ محادثة جديدة</button>
        <div class="session-list" id="session-list"></div>
    </div>

    <div class="main-chat">
        <div class="header">
            <div>
                <h3 id="current-session-title">محادثة عامة</h3>
                <small style="color:var(--text-muted)">نموذج الذكاء الاصطناعي السحابي والأدوات المباشرة</small>
            </div>
            <span class="status-badge">● السيرفر أونلاين ومؤمن 100%</span>
        </div>

        <div class="messages-container" id="messages-container"></div>

        <div class="tool-buttons">
            <span class="tool-chip" onclick="triggerTool('web_search', 'ما هي عاصمة فرنسا؟')">🔍 بحث الويب</span>
            <span class="tool-chip" onclick="triggerTool('python_interpreter', 'print(2**10)')">🐍 مفسر Python</span>
            <span class="tool-chip" onclick="triggerTool('repo_inspector', 'list_files')">📁 فحص المستودع</span>
        </div>

        <div class="composer">
            <input type="text" id="user-input" class="input-box" placeholder="اكتب سؤالك، استفسارك أونلاين، أو اختر أداة للتنفيذ..." autofocus>
            <button class="send-btn" id="send-btn" onclick="sendMsg()">إرسال</button>
        </div>
    </div>

    <script>
        let currentSession = 'session_' + Date.now();
        const msgContainer = document.getElementById('messages-container');
        const inputField = document.getElementById('user-input');

        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMsg();
        });

        function startNewChat() {
            currentSession = 'session_' + Date.now();
            msgContainer.innerHTML = '';
            addMessage('assistant', 'أهلاً بك! أنا جاهز تماماً لمعالجة استفساراتك وتشغيل الأدوات أونلاين.');
            updateSessionList();
        }

        function updateSessionList() {
            const list = document.getElementById('session-list');
            const item = document.createElement('div');
            item.className = 'session-item active';
            item.textContent = currentSession;
            list.appendChild(item);
        }

        async function sendMsg(toolName = null, toolArgs = {}) {
            const text = inputField.value.trim();
            if (!text && !toolName) return;

            const userText = text;
            inputField.value = '';

            if (userText) {
                addMessage('user', userText);
            }

            const typingId = addMessage('assistant', '🌐 [جاري الاتصال بالسيرفرات ومعالجة البيانات...]');

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: currentSession,
                        message: userText,
                        tool: toolName,
                        tool_args: toolArgs
                    })
                });

                const data = await resp.json();
                document.getElementById(typingId).remove();

                if (!resp.ok) {
                    addMessage('assistant', '❌ حدث خطأ: ' + (data.error || 'فشل الاتصال'));
                    return;
                }

                let toolsHtml = '';
                if (data.tools_executed && data.tools_executed.length > 0) {
                    data.tools_executed.forEach(t => {
                        toolsHtml += `<div class="tool-box">🛠️ **أداة حقيقية منفذة:** ${t.tool}<br><code>${JSON.stringify(t.results || t.output || t.files, null, 2)}</code></div>`;
                    });
                }

                addMessage('assistant', toolsHtml + marked.parse(data.message));
                hljs.highlightAll();

            } catch (err) {
                document.getElementById(typingId).remove();
                addMessage('assistant', '❌ فشل الاتصال بالسيرفر.');
            }
        }

        function triggerTool(tool, sampleArg) {
            if (tool === 'web_search') {
                sendMsg('web_search', { query: sampleArg });
            } else if (tool === 'python_interpreter') {
                sendMsg('python_interpreter', { code: sampleArg });
            } else if (tool === 'repo_inspector') {
                sendMsg('repo_inspector', { action: 'list_files', path: '.' });
            }
        }

        function addMessage(role, htmlContent) {
            const id = 'msg_' + Math.random().toString(36).substring(2, 9);
            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            row.id = id;

            const header = document.createElement('div');
            header.className = 'message-header';
            header.textContent = role === 'user' ? '👤 أنت' : '🤖 KHALED AI';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerHTML = htmlContent;

            row.appendChild(header);
            row.appendChild(bubble);
            msgContainer.appendChild(row);

            msgContainer.scrollTop = msgContainer.scrollHeight;
            return id;
        }

        // Init
        startNewChat();
    </script>
</body>
</html>
