# 19. AUTODESK REQUIREMENTS

KHALED-MASTER-PLAN may specify Autodesk/Revit/AutoCAD compatibility.

Never claim a version is supported merely because an adapter exists.

For each claimed version:

COMPILE
+
LOAD/INTEGRATION TEST WHEN ENVIRONMENT EXISTS
+
VERIFY

If the required Autodesk environment is unavailable:

mark the version UNVERIFIED.

Never fabricate Autodesk execution results.

