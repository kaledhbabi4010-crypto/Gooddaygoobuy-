name: KHALED Build Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository audit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path "KHALED-MASTER-PLAN.md")) {
            throw "KHALED-MASTER-PLAN.md is missing."
          }

          Write-Host "=== KHALED REPOSITORY AUDIT ==="
          git status --short

          $projects = @(Get-ChildItem -Path . -Recurse -Filter *.csproj |
            Where-Object {
              $_.FullName -notmatch '\\.git\\|\\bin\\|\\obj\\'
            })

          $solutions = @(Get-ChildItem -Path . -Recurse -Filter *.sln* |
            Where-Object {
              $_.FullName -notmatch '\\.git\\|\\bin\\|\\obj\\'
            })

          Write-Host "Projects: $($projects.Count)"
          Write-Host "Solutions: $($solutions.Count)"

          if ($projects.Count -eq 0 -and $solutions.Count -eq 0) {
            throw "NO REAL IMPLEMENTATION FOUND. The repository contains the plan but no buildable project."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projects = @(Get-ChildItem -Path . -Recurse -Filter *.csproj |
            Where-Object {
              $_.FullName -notmatch '\\.git\\|\\bin\\|\\obj\\'
            })

          foreach ($project in $projects) {
            Write-Host "RESTORE: $($project.FullName)"
            dotnet restore $project.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "RESTORE FAILED: $($project.FullName)"
            }
          }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projects = @(Get-ChildItem -Path . -Recurse -Filter *.csproj |
            Where-Object {
              $_.FullName -notmatch '\\.git\\|\\bin\\|\\obj\\'
            })

          foreach ($project in $projects) {
            Write-Host "BUILD: $($project.FullName)"
            dotnet build $project.FullName --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) {
              throw "BUILD FAILED: $($project.FullName)"
            }
          }

      - name: Test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tests = @(Get-ChildItem -Path . -Recurse -Filter *Tests.csproj |
            Where-Object {
              $_.FullName -notmatch '\\.git\\|\\bin\\|\\obj\\'
            })

          if ($tests.Count -eq 0) {
            throw "NO TEST PROJECT FOUND. Product cannot be declared complete."
          }

          foreach ($test in $tests) {
            Write-Host "TEST: $($test.FullName)"
            dotnet test $test.FullName --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) {
              throw "TEST FAILED: $($test.FullName)"
            }
          }

      - name: Final verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force "artifacts" | Out-Null

          Get-ChildItem -Path . -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '\\.git\\|\\bin\\|\\obj\\|\\artifacts\\'
            } |
            Select-Object FullName, Length |
            Out-File "artifacts/file-inventory.txt"

          "BUILD AND TEST VERIFICATION PASSED" |
            Set-Content "artifacts/verification.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KHALED-evidence
          path: artifacts
          if-no-files-found: ignore
