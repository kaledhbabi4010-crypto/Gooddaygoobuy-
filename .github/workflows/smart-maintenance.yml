name: إصلاح تلقائي موثوق

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4
      
      # هنا ضع أوامر البناء الخاصة بمشروعك
      # مثال لمشروع Android:
      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: بناء المشروع
        id: build
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew build
          elif [ -f "KHALED.sln" ]; then
            if ! command -v dotnet >/dev/null 2>&1; then
              echo "ERROR: dotnet is required for KHALED.sln"
              exit 1
            fi
            dotnet build KHALED.sln --nologo
          elif [ -f "package.json" ]; then
            npm ci
            npm run build
          else
            echo "ERROR: No supported build system detected."
            exit 1
          fi

      - name: 🚑 KHALED GROQ REAL REPAIR
        if: failure() || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          python3 .github/scripts/smart_maintenance.py


      # ============================================================
      # POST-REPAIR VERIFICATION
      # Never declare success without a real build/test.
      # ============================================================
      - name: POST-REPAIR VERIFICATION
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "=== POST-REPAIR VERIFICATION ==="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build
          elif [ -f "./KHALED.sln" ]; then
            if ! command -v dotnet >/dev/null 2>&1; then
              echo "ERROR: dotnet is required to verify KHALED.sln"
              exit 1
            fi
            dotnet build KHALED.sln --nologo
            dotnet test KHALED.sln --no-restore --nologo
          elif [ -f "./package.json" ]; then
            npm ci
            npm run build
          else
            echo "ERROR: No supported project detected for verification."
            exit 1
          fi
