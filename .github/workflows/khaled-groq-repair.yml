name: KHALED GROQ TARGETED SELF-REPAIR

on:
  push:
    branches:
      - khaled-gemini-direct-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: khaled-gemini-direct-fix
          fetch-depth: 0

      - name: Collect TARGETED Gemini Self-Repair context
        shell: bash
        run: |
          set -e
          echo '=== TARGETED FILE DISCOVERY ==='
          find . -type f \-not -path './.git/*' \ | grep -Ei 'gemini|self.?repair|repair' | head -100 > /tmp/targets.txt || true
          cat /tmp/targets.txt

          : > /tmp/context.txt
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            echo '' >> /tmp/context.txt
            echo "===== FILE: $f =====" >> /tmp/context.txt
            sed -n '1,240p' "$f" >> /tmp/context.txt || true
          done < /tmp/targets.txt

          echo '=== CONTEXT SIZE BEFORE CAP ==='
          wc -c /tmp/context.txt

          head -c 16000 /tmp/context.txt > /tmp/context-limited.txt
          mv /tmp/context-limited.txt /tmp/context.txt

          echo '=== CONTEXT SIZE SENT TO GROQ ==='
          wc -c /tmp/context.txt

      - name: Real pre-repair build evidence
        shell: bash
        run: |
          set +e
          : > /tmp/build-before.txt

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew test --no-daemon 2>&1 | tee /tmp/build-before.txt
            echo "GRADLE_EXIT=${PIPESTATUS[0]}" >> /tmp/build-before.txt
          elif find . -name '*.sln' -o -name '*.csproj' | grep -q .; then
            dotnet restore 2>&1 | tee /tmp/build-before.txt
            dotnet build --no-restore 2>&1 | tee -a /tmp/build-before.txt
            echo "DOTNET_EXIT=${PIPESTATUS[0]}" >> /tmp/build-before.txt
          else
            echo 'NO_SUPPORTED_BUILD_SYSTEM_FOUND' | tee /tmp/build-before.txt
          fi

          tail -n 120 /tmp/build-before.txt

      - name: Ask Groq for minimal unified diff
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os, json, urllib.request

          key = os.environ.get('GROQ_API_KEY','').strip()
          if not key:
              raise SystemExit('GROQ_API_KEY secret is missing')

          context = open('/tmp/context.txt', encoding='utf-8', errors='ignore').read()
          evidence = open('/tmp/build-before.txt', encoding='utf-8', errors='ignore').read()[-9000:]

          prompt = '''You are KHALED's repair engineer.

Repair ONLY the Gemini Self-Repair implementation.

Rules:
1. Do not redesign the project.
2. Do not modify unrelated files.
3. Do not invent APIs or test results.
4. Preserve existing architecture.
5. Fix only concrete defects visible in the supplied files/evidence.
6. Return ONLY a unified git diff.
7. The diff must use existing repository paths.
8. If there is not enough evidence for a safe fix, return an empty diff.

TARGETED SOURCE FILES:
''' + context + '''

REAL PRE-REPAIR BUILD/TEST EVIDENCE:
''' + evidence + '''

Return ONLY the patch beginning with diff --git, or return EMPTY if no safe repair is justified.
'''

          payload = {
              'model': 'openai/gpt-oss-120b',
              'messages': [
                  {'role':'user','content':prompt}
              ],
              'temperature': 0.1,
              'max_tokens': 1800
          }

          req = urllib.request.Request(
              'https://api.groq.com/openai/v1/chat/completions',
              data=json.dumps(payload).encode(),
              headers={
                  'Authorization':'Bearer '+key,
                  'Content-Type':'application/json'
              },
              method='POST'
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  data=json.loads(resp.read().decode())
          except Exception as e:
              raise SystemExit('GROQ_REQUEST_FAILED: '+str(e))

          text = data['choices'][0]['message']['content']
          open('/tmp/groq.patch','w',encoding='utf-8').write(text)

          print('=== GROQ RESPONSE SIZE ===')
          print(len(text))
          print(text[:5000])
          PY

      - name: Validate and apply Groq patch
        shell: bash
        run: |
          set -e
          if grep -q '^diff --git ' /tmp/groq.patch; then
            git apply --check /tmp/groq.patch
            git apply /tmp/groq.patch
            git diff --check
          else
            echo 'NO_VALID_PATCH_RETURNED'
          fi

          echo '=== MODIFIED FILES ==='
          git status --short

      - name: Real post-repair build/test
        shell: bash
        run: |
          set +e
          : > /tmp/build-after.txt

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew test --no-daemon 2>&1 | tee /tmp/build-after.txt
            code=${PIPESTATUS[0]}
          elif find . -name '*.sln' -o -name '*.csproj' | grep -q .; then
            dotnet restore 2>&1 | tee /tmp/build-after.txt
            dotnet build --no-restore 2>&1 | tee -a /tmp/build-after.txt
            code=${PIPESTATUS[0]}
          else
            echo 'NO_SUPPORTED_BUILD_SYSTEM_FOUND' | tee /tmp/build-after.txt
            code=2
          fi

          echo 'POST_REPAIR_EXIT='$code
          tail -n 160 /tmp/build-after.txt
          exit $code

      - name: Commit ONLY verified repair
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git status --short
          git diff --check

          if git diff --quiet; then
            echo 'NO_SOURCE_CHANGES_TO_COMMIT'
            exit 0
          fi

          git add -u
          git commit -m 'KHALED: verified targeted Groq Gemini self-repair'
          git push origin HEAD:khaled-gemini-direct-fix
