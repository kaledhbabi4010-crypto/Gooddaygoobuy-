name: KHALED CI Factory

run-name: "KHALED • ${{ github.event_name }} • ${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khaled-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  CONFIGURATION: Release

jobs:

  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate required files
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "KHALED-MASTER-PLAN.md"

          echo "Repository validation passed."

      - name: Detect project
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t PROJECTS < <(
            find . \
              -type f \
              -name "*.sln" -o -name "*.slnx" -o -name "*.csproj" \
              -not -path "./.git/*" \
              | sort
          )

          if (( ${#PROJECTS[@]} == 0 )); then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::error::No .NET solution or project was found."
            exit 1
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"

          printf '%s\n' "${PROJECTS[@]}" \
            | tee project-list.txt

      - name: Upload project manifest
        uses: actions/upload-artifact@v4
        with:
          name: khaled-project-manifest
          path: project-list.txt
          if-no-files-found: error


  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Discover projects
        shell: bash
        run: |
          set -Eeuo pipefail

          find . \
            -type f \
            -name "*.sln" -o -name "*.slnx" -o -name "*.csproj" \
            -not -path "./.git/*" \
            | sort \
            | tee project-list.txt

      - name: Restore
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r project; do
            [ -z "$project" ] && continue
            dotnet restore "$project"
          done < project-list.txt

      - name: Build
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r project; do
            [ -z "$project" ] && continue

            dotnet build "$project" \
              --configuration "$CONFIGURATION" \
              --no-restore \
              --verbosity minimal
          done < project-list.txt

      - name: Publish build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khaled-build-evidence
          path: |
            project-list.txt
            **/bin/**/*.dll
          if-no-files-found: warn


  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Discover test projects
        id: tests
        shell: bash
        run: |
          set -Eeuo pipefail

          find . \
            -type f \
            -name "*.csproj" \
            -not -path "./.git/*" \
            | grep -Ei "(test|tests)" \
            | sort \
            | tee test-list.txt || true

      - name: Restore
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r project; do
            [ -z "$project" ] && continue
            dotnet restore "$project"
          done < test-list.txt

      - name: Test
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -s test-list.txt ]; then
            echo "::warning::No test project detected."
            exit 0
          fi

          while IFS= read -r project; do
            [ -z "$project" ] && continue

            dotnet test "$project" \
              --configuration "$CONFIGURATION" \
              --no-restore \
              --verbosity normal
          done < test-list.txt

      - name: Upload test manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khaled-test-evidence
          path: test-list.txt
          if-no-files-found: warn


  security:
    name: Security and Integrity
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Repository integrity
        shell: bash
        run: |
          set -Eeuo pipefail

          if git diff --exit-code; then
            echo "Working tree is clean."
          else
            echo "::error::Unexpected repository modifications detected."
            exit 1
          fi

      - name: Detect suspicious tracked secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          if git grep -n -I -E \
            'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' \
            -- ':!*.lock.yml'; then
            echo "::error::Potential credential material detected."
            exit 1
          fi

          echo "Secret-pattern scan passed."


  package:
    name: Package Evidence
    needs: [build, test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create evidence package
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p artifacts

          {
            echo "KHALED CI EVIDENCE"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run: $GITHUB_RUN_ID"
            echo "Configuration: $CONFIGURATION"
            echo "DOTNET_VERSION: $DOTNET_VERSION"
            echo
            echo "Tracked files:"
            git ls-files
          } > artifacts/build-evidence.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: KHALED-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error


  result:
    name: Final Verification
    needs: [validate, build, test, security, package]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate pipeline
        shell: bash
        run: |
          set -Eeuo pipefail

          RESULTS=(
            "${{ needs.validate.result }}"
            "${{ needs.build.result }}"
            "${{ needs.test.result }}"
            "${{ needs.security.result }}"
            "${{ needs.package.result }}"
          )

          for result in "${RESULTS[@]}"; do
            if [ "$result" != "success" ]; then
              echo "::error::KHALED pipeline failed: $result"
              exit 1
            fi
          done

          echo "KHALED pipeline completed successfully."
