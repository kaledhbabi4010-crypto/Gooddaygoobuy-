name: KHALED DIRECT GEMINI REPAIR

on:
  push:
    branches:
      - khaled-gemini-direct-fix

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: Checkout V6 repair branch
        uses: actions/checkout@v4
        with:
          ref: khaled-gemini-direct-fix
          fetch-depth: 0

      - name: Gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

          prompt: |
            EXECUTE DIRECTLY.

            You are repairing the real repository.

            CURRENT BRANCH:
            khaled-gemini-direct-fix

            PROTECTED:
            main
            khaled-repair-v6

            BASELINE:
            khaled-repair-v6
            c87edb18335e5869ed2278e1ecf18ee579c4cc6e

            Do not modify main.
            Do not modify khaled-repair-v6.
            Do not create a replacement project.
            Do not merely explain.
            Do not ask permission.

            Inspect the real repository.

            Find the actual current failures.

            Fix the existing source/workflow files directly.

            Run the real build.

            Run the real tests that are available.

            Read the actual errors.

            Fix them.

            Build again.

            Test again.

            Continue until the actual failure is fixed
            or until a genuine external limitation prevents it.

            Pay particular attention to:
            - .github/workflows
            - Android build configuration
            - Gradle
            - existing Gemini workflows
            - KHALED runtime
            - repair engine
            - existing tests
            - build.log handling
            - actual compiler errors

            Do not fabricate success.

            Before finishing run:

            git status --short
            git diff --check
            git diff --stat

            Commit only actual repair changes.

            Push ONLY to:
            khaled-gemini-direct-fix

            EXECUTE NOW.
