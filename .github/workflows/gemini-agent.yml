name: Gemini Self Repair

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Git identity
        run: |
          git config user.name "Gemini Self Repair"
          git config user.email "gemini-self-repair@users.noreply.github.com"

      - name: Gemini Self Repair
        uses: google-github-actions/run-gemini-cli@v0
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: "0.58.0"
          prompt: |
            SELF-REPAIR ONLY.

            Do not develop KHALED.
            Do not develop REVO AI.
            Do not modify application functionality.

            Inspect the entire .github/workflows directory,
            GEMINI.md, KHALED-MASTER-PLAN.md and git history.

            Your only mission is to repair the Gemini agent infrastructure.

            Find and repair:
            - invalid YAML
            - duplicate Gemini workflows
            - conflicting Gemini workflows
            - incorrect Gemini CLI configuration
            - missing trusted-workspace configuration
            - incorrect API key wiring
            - incorrect GitHub permissions
            - checkout problems
            - Git configuration problems
            - incorrect workflow paths
            - malformed prompts
            - unsafe configuration
            - accidental corruption of workflow files

            Keep GEMINI.md separate from YAML workflow files.

            Validate the repaired YAML.
            Inspect git diff.
            Check for accidental file corruption.
            Check for exposed secrets.

            Remove or disable obsolete/conflicting Gemini workflows
            only when necessary for a clean single-agent architecture.

            Do not modify application source code.

            Do not claim VERIFIED without real evidence.

            If the repair is valid, commit the repair.

            Final report:
            ROOT CAUSE
            FILES CHANGED
            REPAIR
            VALIDATION
            REMAINING BLOCKERS
            STATUS

      - name: Final verification
        if: always()
        run: |
          echo "=== WORKFLOW FILES ==="
          find .github/workflows -maxdepth 1 -type f -print
          echo "=== GIT STATUS ==="
          git status --short
          echo "=== CURRENT COMMIT ==="
          git rev-parse HEAD
