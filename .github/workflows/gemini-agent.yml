name: Gemini Self Repair

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: google-github-actions/run-gemini-cli@v0
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GH_WORKFLOW_PAT }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: "0.58.0"
          gemini_model: "gemini-1.5-flash"
          prompt: |
            SELF-REPAIR ONLY: Fix invalid YAML or action issues in .github/workflows/.
            Validate repair with git diff and commit if verified. Final status: VERIFIED/FAILED
