name: Gemini AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Gemini"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: gemini-agent
  cancel-in-progress: false

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Gemini AI Agent"
          git config user.email "gemini-agent@users.noreply.github.com"

      - name: Preflight
        shell: bash
        run: |
          set -e
          echo "=== REPOSITORY ==="
          git remote -v
          git branch --show-current
          git rev-parse HEAD
          echo "=== STATUS ==="
          git status --short
          echo "=== REQUIRED FILES ==="
          test -f GEMINI.md
          test -f KHALED-MASTER-PLAN.md
          test -f .github/workflows/gemini-agent.yml
          echo "PREFLIGHT_OK"

      - name: Gemini AI Agent
        uses: google-github-actions/run-gemini-cli@v0
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: "0.58.0"
          prompt: |
            You are the autonomous repair engineer for this repository.

            IMPORTANT:
            Your FIRST and ONLY objective in this run is to repair and
            stabilize the Gemini AI Agent infrastructure itself.

            DO NOT develop, redesign, or extend KHALED or REVO AI yet.

            Read completely:
            - GEMINI.md
            - KHALED-MASTER-PLAN.md
            - .github/workflows/gemini-agent.yml
            - all other .github/workflows/*.yml files

            Inspect the Git history and current repository state.

            Determine whether the Gemini workflow can reliably:
            - start
            - trust the workspace
            - authenticate
            - access the repository
            - modify files
            - commit changes when necessary
            - run validation
            - report evidence

            Repair ONLY Gemini-agent infrastructure and workflow problems.

            Check for:
            - invalid YAML
            - duplicate/conflicting Gemini workflows
            - incorrect Gemini CLI configuration
            - trust/workspace configuration
            - API-key wiring
            - GitHub permissions
            - checkout configuration
            - Git configuration
            - unstable Gemini CLI version selection
            - missing timeouts
            - unsafe or contradictory workflow instructions
            - incorrect paths
            - malformed prompts
            - configuration that can cause hangs or immediate failures

            Preserve application functionality.

            Do NOT modify KHALED/REVO AI application code unless absolutely
            required to repair the Gemini infrastructure.

            After every meaningful infrastructure change:
            1. Validate the YAML.
            2. Inspect the resulting workflow.
            3. Run available infrastructure checks.
            4. Diagnose failures.
            5. Repair failures.
            6. Re-run validation.

            Never fabricate results.

            Never claim VERIFIED unless there is actual evidence.

            Evidence states allowed:
            VERIFIED
            FAILED
            NOT_VERIFIED
            NOT_APPLICABLE
            BLOCKED

            Do not convert NOT_VERIFIED to VERIFIED without evidence.

            If another Gemini workflow is obsolete or conflicts with the
            intended agent, identify it clearly and remove/disable it only
            if doing so is necessary and safe.

            Do not start project development after repairing the agent.

            At the end provide a concise report containing:
            - root cause
            - files changed
            - fixes made
            - validation performed
            - build/test results if applicable
            - remaining blockers
            - evidence
            - final status

            User task:
            ${{ inputs.task }}

      - name: Final repository status
        if: always()
        shell: bash
        run: |
          echo "=== FINAL STATUS ==="
          git status --short
          echo "=== CURRENT COMMIT ==="
          git rev-parse HEAD
          echo "=== RECENT COMMITS ==="
          git log -5 --oneline
