name: Gemini AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Gemini Task"
        required: true
        type: string

  issues:
    types: [opened]

  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  gemini:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        contains(github.event.issue.body, '@gemini-cli')
      ) ||
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@gemini-cli')
      )

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are the autonomous AI engineer for this repository.

            Read these files first:
            - GEMINI.md
            - KHALED-MASTER-PLAN.md

            USER TASK:
            ${{ github.event.inputs.task || github.event.comment.body || github.event.issue.body }}

            Execute the task completely.

            WORK:
            1. Inspect the repository.
            2. Understand the existing architecture.
            3. Implement the required changes.
            4. Build the project.
            5. Run tests.
            6. Diagnose failures.
            7. Repair failures.
            8. Build again.
            9. Test again.
            10. Verify the result.

            IMPORTANT:
            Never fabricate results.
            Never claim success without real evidence.
            Never claim Autodesk, Revit, or AutoCAD verification
            without a real Autodesk environment.
            Never change NOT_VERIFIED to VERIFIED without evidence.
            Never hide failures.
            Preserve existing functionality.

            Use the existing repository scripts whenever possible.

            At the end report:
            - What was changed
            - Build result
            - Test result
            - Verification result
            - Remaining blockers
            - Evidence
