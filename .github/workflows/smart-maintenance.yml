name: نظام الصيانة الشاملة الذكي

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: '📁 مسار الملف المراد صيانته (مثال: README.md أو src/main.py)'
        required: true
        default: 'README.md'
      
      task_type:
        description: '🎯 نوع المهمة'
        required: true
        type: choice
        options:
          - 'صيانة شاملة (مراجعة + تحسين + إصلاح)'
          - 'إصلاح الأخطاء فقط'
          - 'تحسين الأداء'
          - 'إضافة تعليقات وتوثيق'
          - 'أمر مخصص (اكتبه في خانة الأمر)'
        default: 'صيانة شاملة (مراجعة + تحسين + إصلاح)'
      
      custom_command:
        description: '💬 اكتب أمرك بالعربية (يعمل مع "أمر مخصص" أو كإضافة للمهام الأخرى)'
        required: false
        default: ''
      
      verify_after:
        description: '✅ التحقق من تنفيذ التعديلات بعد الانتهاء'
        required: true
        type: choice
        options:
          - 'نعم، تحقق تلقائياً'
          - 'لا، فقط نفّذ'
        default: 'نعم، تحقق تلقائياً'

jobs:
  smart-maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install groq requests
      
      - name: تشغيل نظام الصيانة الذكي
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE_PATH: ${{ github.event.inputs.file_path }}
          TASK_TYPE: ${{ github.event.inputs.task_type }}
          CUSTOM_COMMAND: ${{ github.event.inputs.custom_command }}
          VERIFY_AFTER: ${{ github.event.inputs.verify_after }}
        run: python .github/scripts/smart_maintenance.py
