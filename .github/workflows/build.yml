name: KHALED CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Create project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path "KHALED-X.csproj")) {
            dotnet new console `
              --name KHALED-X `
              --framework net8.0 `
              --output .
          }

      - name: Restore
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore KHALED-X.csproj

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet build KHALED-X.csproj `
            --configuration Release `
            --no-restore `
            --nologo

      - name: Run
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet run `
            --project KHALED-X.csproj `
            --configuration Release `
            --no-build

      - name: Publish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item "artifacts" -Recurse -Force -ErrorAction SilentlyContinue

          dotnet publish KHALED-X.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output artifacts/publish `
            --nologo

          if (!(Test-Path "artifacts/publish")) {
            throw "Publish failed."
          }

      - name: Generate SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = Get-ChildItem "artifacts/publish" -File -Recurse

          if ($files.Count -eq 0) {
            throw "No published files found."
          }

          $hashes = foreach ($file in $files) {
            $h = Get-FileHash $file.FullName -Algorithm SHA256

            [PSCustomObject]@{
              File = $file.FullName
              SHA256 = $h.Hash
            }
          }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $hashes |
            ConvertTo-Json -Depth 5 |
            Set-Content "artifacts/SHA256.json"

      - name: Verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          @"
          KHALED CI VERIFICATION

          Repository: $env:GITHUB_REPOSITORY
          Commit: $env:GITHUB_SHA
          Build: PASS
          Runtime: PASS
          Publish: PASS
          SHA256: PASS

          Autodesk compatibility is NOT claimed here.
          Revit/AutoCAD compatibility requires real Autodesk
          SDK/application testing.
          "@ | Set-Content "artifacts/VERIFICATION.txt"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KHALED-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
