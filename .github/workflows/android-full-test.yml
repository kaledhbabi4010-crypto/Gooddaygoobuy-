name: GQS Full Android Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android-full-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify CI Java
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"
          "$JAVA_HOME/bin/java" -version
          echo "CI JAVA: PASS"

      - name: Build both APKs
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "BUILD android_app"
          echo "=================================================="

          test -d android_app
          test -f android_app/app/build.gradle || test -f android_app/app/build.gradle.kts

          gradle -p android_app clean assembleDebug --no-daemon \
            -Dorg.gradle.java.home="$JAVA_HOME"

          echo "=================================================="
          echo "BUILD khaled_android"
          echo "=================================================="

          test -d khaled_android
          test -f khaled_android/app/build.gradle || test -f khaled_android/app/build.gradle.kts

          gradle -p khaled_android clean assembleDebug --no-daemon \
            -Dorg.gradle.java.home="$JAVA_HOME"

          echo "=================================================="
          echo "APK VERIFICATION"
          echo "=================================================="

          for APK in \
            android_app/app/build/outputs/apk/debug/app-debug.apk \
            khaled_android/app/build/outputs/apk/debug/app-debug.apk
          do
            test -f "$APK"
            unzip -t "$APK" >/dev/null
            unzip -l "$APK" | grep -q AndroidManifest.xml
            echo "VERIFIED: $APK"
            ls -lh "$APK"
          done

      - name: Run real Android emulator tests
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: khaled-api35
          force-avd-creation: true
          emulator-boot-timeout: 900
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: false
          script: |
            set -e
            mkdir -p evidence
            ADB="$ANDROID_HOME/platform-tools/adb"

            echo "DEVICE"
            "$ADB" devices

            echo "BOOT"
            for i in $(seq 1 60); do
              B=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              [ "$B" = "1" ] && break
              sleep 5
            done

            [ "$B" = "1" ] || {
              echo "BOOT: FAIL"
              "$ADB" shell getprop > evidence/getprop.txt || true
              "$ADB" logcat -d > evidence/logcat.txt || true
              exit 1
            }

            echo "BOOT: PASS"

            for ITEM in android_app khaled_android; do
              APK="$GITHUB_WORKSPACE/$ITEM/app/build/outputs/apk/debug/app-debug.apk"
              test -f "$APK" || { echo "APK: FAIL $ITEM"; exit 1; }

              AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
              PKG="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
              test -n "$PKG"

              "$ADB" install -r "$APK"
              "$ADB" logcat -c

              ACT="$("$ADB" shell cmd package resolve-activity --brief "$PKG" | tail -1 | tr -d '\r')"
              "$ADB" shell am start -W -n "$ACT"
              sleep 10

              PID="$("$ADB" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"
              "$ADB" logcat -d > "evidence/${ITEM}_logcat.txt"

              test -n "$PID" || { echo "PROCESS: FAIL $ITEM"; exit 1; }
              ! grep -qE "FATAL EXCEPTION|AndroidRuntime.*FATAL|am_crash" "evidence/${ITEM}_logcat.txt"

              "$ADB" shell uninstall "$PKG" || true
              echo "TEST: PASS $ITEM"
            done

            echo "REAL ANDROID TEST: PASS"

      - name: Huawei compatibility audit
        shell: bash
        run: |
          set -e

          mkdir -p evidence

          python3 <<'PY'
          import zipfile
          from pathlib import Path

          apks = [
              Path("android_app/app/build/outputs/apk/debug/app-debug.apk"),
              Path("khaled_android/app/build/outputs/apk/debug/app-debug.apk")
          ]

          with open("evidence/huawei_compatibility.txt", "w") as out:
              for apk in apks:
                  out.write(f"\n=== {apk} ===\n")

                  with zipfile.ZipFile(apk) as z:
                      files = [x.lower() for x in z.namelist()]

                  gms = [
                      x for x in files
                      if "com/google/android/gms" in x
                      or "play-services" in x
                      or "firebase" in x
                  ]

                  hms = [
                      x for x in files
                      if "com/huawei" in x
                      or "hms" in x
                  ]

                  out.write(f"GMS indicators: {len(gms)}\n")
                  out.write(f"HMS indicators: {len(hms)}\n")
                  out.write("STATIC HUAWEI AUDIT: COMPLETE\n")
                  out.write("REAL HUAWEI DEVICE: NOT TESTED\n")

          PY
          cat evidence/huawei_compatibility.txt

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GQS-full-android-test-evidence
          path: |
            android_app/app/build/outputs/apk/debug/app-debug.apk
            khaled_android/app/build/outputs/apk/debug/app-debug.apk
            evidence/
          if-no-files-found: warn
