name: KHALED - Gemini Direct Repair

on:
  push:
    branches:
      - khaled-gemini-direct-fix
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: khaled-gemini-direct-fix
          fetch-depth: 0

      - name: Gemini Direct Repair
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          settings: |
            {
              "general": {
                "defaultApprovalMode": "yolo"
              }
            }
          prompt: |
            DIRECT EXECUTION ONLY.

            Work ONLY on:
            khaled-gemini-direct-fix

            NEVER modify:
            main
            khaled-repair-v6

            Known healthy baseline:
            khaled-repair-v6
            c87edb18335e5869ed2278e1ecf18ee579c4cc6e

            Inspect the actual repository.

            Find the actual current build/test failures.

            Fix the existing code directly.

            Do NOT create a replacement project.

            Do NOT make a plan for the user.
            Do NOT ask for permission.
            EXECUTE THE REPAIR.

            Run real builds.
            Run real tests.
            Read real error output.

            If a build/test fails:
              inspect the actual error,
              fix the cause,
              run again.

            Continue:
            INSPECT -> EDIT -> BUILD -> TEST -> FIX

            Do not fabricate results.

            Do not claim success without real execution evidence.

            Check for untracked generated files such as build.log.
            Do not commit unnecessary generated logs.

            Before finishing run:

            git status --short
            git diff --check
            git diff --stat

            Commit the actual repair.

            Push ONLY to:
            khaled-gemini-direct-fix

            EXECUTE NOW.
