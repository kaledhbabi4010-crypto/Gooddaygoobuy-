name: الماسح والمصلح التلقائي

on:
  push:
    branches: [main, master]
  workflow_dispatch: # يسمح لك بتشغيله يدوياً أيضاً بضغطة زر

jobs:
  scan-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install groq requests

      - name: تشغيل الماسح والمصلح
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/scanner_fixer.py
        
      # ضمان عدم ظهور أي خطأ أحمر في واجهة GitHub
      - name: إنهاء العملية بنجاح
        run: exit 0
