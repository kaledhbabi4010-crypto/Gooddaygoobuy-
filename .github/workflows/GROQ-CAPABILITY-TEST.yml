name: GROQ Full File Capability Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  groq:
    runs-on: ubuntu-latest
    steps:
      - name: GROQ surgical repair
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '' | base64 -d > /tmp/groq_agent.py
          python3 /tmp/groq_agent.py
