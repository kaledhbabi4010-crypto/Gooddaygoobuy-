name: Gemini AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "اكتب مهمة Gemini هنا"
        required: true
        type: string

  issues:
    types: [opened]

  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  gemini:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        contains(github.event.issue.body, '@gemini-cli')
      ) ||
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@gemini-cli')
      )

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini AI Agent
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are the lead autonomous engineer for this repository.

            FIRST:
            - Read GEMINI.md.
            - Read KHALED-MASTER-PLAN.md.
            - Inspect the entire repository before making important changes.

            USER TASK:
            ${{ github.event.inputs.task || github.event.comment.body || github.event.issue.body }}

            OBJECTIVE:
            Execute the user's task completely and autonomously.

            WORKFLOW:
            1. Inspect the repository.
            2. Understand the existing architecture.
            3. Identify the highest-priority work required.
            4. Implement the required changes.
            5. Build the project.
            6. Run all available tests.
            7. Diagnose every failure.
            8. Repair failures.
            9. Rebuild.
            10. Retest.
            11. Verify the final state.
            12. Preserve existing working functionality.
            13. Commit and push legitimate changes when appropriate.

            STRICT TRUTH RULES:
            - Never fabricate results.
            - Never claim a build passed unless it actually passed.
            - Never claim tests passed unless they actually passed.
            - Never claim Autodesk/Revit/AutoCAD verification without a real
              Autodesk environment and real evidence.
            - Never convert NOT_VERIFIED into VERIFIED without evidence.
            - Never hide failures or blockers.
            - Never remove functionality just to make tests pass.
            - Use repository scripts whenever available.
            - Minimize unnecessary model calls.
            - Work incrementally and safely.

            FINAL REPORT:
            - Task completed
            - Files changed
            - Build result
            - Test result
            - Verification result
            - Remaining blockers
            - Evidence for every claimed success
