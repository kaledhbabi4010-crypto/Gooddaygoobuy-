name: GQS Full Android Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android-full-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build both APKs
        shell: bash
        run: |
          set -e

          chmod +x android_app/gradlew khaled_android/gradlew

          cd android_app
          ./gradlew clean assembleDebug --no-daemon

          cd ../khaled_android
          ./gradlew clean assembleDebug --no-daemon

      - name: Verify APKs
        shell: bash
        run: |
          set -e

          for APK in \
            android_app/app/build/outputs/apk/debug/app-debug.apk \
            khaled_android/app/build/outputs/apk/debug/app-debug.apk
          do
            test -f "$APK"
            unzip -t "$APK" >/dev/null
            unzip -l "$APK" | grep -q AndroidManifest.xml
            echo "VERIFIED: $APK"
            ls -lh "$APK"
          done

      - name: Run real Android emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e

            mkdir -p evidence

            ADB="$ANDROID_HOME/platform-tools/adb"

            echo "=== DEVICE ==="
            "$ADB" devices

            echo "=== ANDROID VERSION ==="
            "$ADB" shell getprop ro.build.version.release
            "$ADB" shell getprop ro.build.version.sdk

            test "$("$ADB" shell getprop sys.boot_completed" | tr -d '\r')" = "1"

            for ITEM in android_app khaled_android
            do
              echo
              echo "=================================================="
              echo "REAL TEST: $ITEM"
              echo "=================================================="

              APK="$GITHUB_WORKSPACE/$ITEM/app/build/outputs/apk/debug/app-debug.apk"

              "$ADB" install -r "$APK"

              echo "INSTALL: PASS"

              "$ADB" logcat -c

              "$ADB" shell am start \
                -W \
                -n com.quickservice.giant/com.quickservice.giant.MainActivity

              sleep 10

              "$ADB" shell pidof com.quickservice.giant

              "$ADB" logcat -d > "evidence/${ITEM}_logcat.txt"

              if grep -qE "FATAL EXCEPTION|AndroidRuntime.*FATAL|am_crash" \
                "evidence/${ITEM}_logcat.txt"
              then
                echo "CRASH: DETECTED"
                exit 1
              fi

              echo "CRASH: NOT DETECTED"

              "$ADB" shell dumpsys package com.quickservice.giant \
                > "evidence/${ITEM}_package.txt"

              "$ADB" uninstall com.quickservice.giant || true
            done

            echo
            echo "REAL ANDROID TEST: PASS"

      - name: Huawei compatibility audit
        shell: bash
        run: |
          set -e

          mkdir -p evidence

          python3 <<'PY'
          import zipfile
          from pathlib import Path

          apks = [
              Path("android_app/app/build/outputs/apk/debug/app-debug.apk"),
              Path("khaled_android/app/build/outputs/apk/debug/app-debug.apk")
          ]

          with open("evidence/huawei_compatibility.txt", "w") as out:
              for apk in apks:
                  out.write(f"\n=== {apk} ===\n")

                  with zipfile.ZipFile(apk) as z:
                      files = [x.lower() for x in z.namelist()]

                  gms = [
                      x for x in files
                      if "com/google/android/gms" in x
                      or "play-services" in x
                      or "firebase" in x
                  ]

                  hms = [
                      x for x in files
                      if "com/huawei" in x
                      or "hms" in x
                  ]

                  out.write(f"GMS indicators: {len(gms)}\n")
                  out.write(f"HMS indicators: {len(hms)}\n")
                  out.write("STATIC HUAWEI AUDIT: COMPLETE\n")
                  out.write("REAL HUAWEI DEVICE: NOT TESTED\n")

          cat evidence/huawei_compatibility.txt

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GQS-full-android-test-evidence
          path: |
            android_app/app/build/outputs/apk/debug/app-debug.apk
            khaled_android/app/build/outputs/apk/debug/app-debug.apk
            evidence/
          if-no-files-found: warn
