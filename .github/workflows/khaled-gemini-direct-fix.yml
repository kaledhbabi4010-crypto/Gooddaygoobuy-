name: KHALED DIRECT GEMINI REPAIR

on:
  push:
    branches:
      - khaled-gemini-direct-fix

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: khaled-gemini-direct-fix
          fetch-depth: 0

      - name: Trust workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Gemini Direct Repair
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

          prompt: |
            EXECUTE DIRECTLY.

            Work ONLY on khaled-gemini-direct-fix.

            NEVER modify main.
            NEVER modify khaled-repair-v6.

            Baseline:
            khaled-repair-v6
            c87edb18335e5869ed2278e1ecf18ee579c4cc6e

            Inspect the real repository.

            Find the actual failures.

            Edit the existing files directly.

            Run real builds and real tests.

            Read actual errors.

            Fix the actual causes.

            Repeat:
            INSPECT -> EDIT -> BUILD -> TEST -> FIX

            Do not create a replacement project.

            Do not fabricate results.

            Do not stop at analysis.

            Do not ask for permission.

            Continue until the real failure is fixed
            or a genuine external limitation prevents it.

            Check git diff --check.

            Commit the actual repair.

            Push ONLY to khaled-gemini-direct-fix.

            EXECUTE NOW.
