name: KHALED CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate KHALED plan
        shell: pwsh
        run: |
          if (-not (Test-Path "KHALED-MASTER-PLAN.md")) {
            Write-Error "KHALED-MASTER-PLAN.md not found"
            exit 1
          }

          Write-Host "KHALED plan found."

      - name: Detect implementation
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path . -Recurse -Filter *.csproj -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\bin\\|\\obj\\' }

          if ($projects.Count -eq 0) {
            Write-Error "NO IMPLEMENTATION FOUND: the repository contains the plan but no .NET project."
            exit 1
          }

          Write-Host "Projects found: $($projects.Count)"

      - name: Restore
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\bin\\|\\obj\\' } |
            ForEach-Object {
              dotnet restore $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

      - name: Build
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\bin\\|\\obj\\' } |
            ForEach-Object {
              dotnet build $_.FullName --configuration Release --no-restore
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

      - name: Test
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Path . -Recurse -Filter *Tests.csproj |
            Where-Object { $_.FullName -notmatch '\\bin\\|\\obj\\' }

          if ($tests.Count -eq 0) {
            Write-Error "NO TEST PROJECT FOUND"
            exit 1
          }

          foreach ($test in $tests) {
            dotnet test $test.FullName --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\.git\\|\\bin\\|\\obj\\|\\artifacts\\' } |
            Select-Object FullName,Length |
            Out-File artifacts/inventory.txt

          "VERIFICATION COMPLETED" | Out-File artifacts/verification.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KHALED-evidence
          path: artifacts
          if-no-files-found: ignore
