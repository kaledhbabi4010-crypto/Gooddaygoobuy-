name: إصلاح تلقائي موثوق

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4
      
      # هنا ضع أوامر البناء الخاصة بمشروعك
      # مثال لمشروع Android:
      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: بناء المشروع
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew || true
          ./gradlew build || npm run build || echo "بناء عادي"
      
      # 👇 هذا هو الحل الموثوق - يعمل تلقائياً عند الفشل
      - name: 🚑 إصلاح تلقائي بالذكاء الاصطناعي
        if: failure()
        uses: mariorazo97/ai-ci-healer@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-provider: "groq"
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          confidence-threshold: 60
          enable-comments: true
