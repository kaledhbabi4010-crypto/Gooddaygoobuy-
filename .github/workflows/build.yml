name: KHALED Factory — Autonomous Debug Build Test Repair

on:
  workflow_dispatch:
    inputs:
      repair:
        description: "Enable controlled automatic repair"
        required: true
        default: "true"
        type: boolean
      max_repair_rounds:
        description: "Maximum repair rounds"
        required: true
        default: "3"
        type: string

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: khaled-factory-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  CONFIGURATION: Release
  MAX_REPAIR_ROUNDS: ${{ inputs.max_repair_rounds || '3' }}

jobs:

  # ============================================================
  # AGENT 01 — ORCHESTRATOR
  # ============================================================

  orchestrator:
    name: "01 • Orchestrator"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      repo_valid: ${{ steps.validate.outputs.valid }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate factory inputs
        id: validate
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f KHALED-MASTER-PLAN.md

          mkdir -p artifacts

          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run=${GITHUB_RUN_ID}"
            echo "timestamp=$(date -u +%FT%TZ)"
          } > artifacts/run-context.txt

          echo "valid=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-01-orchestrator
          path: artifacts/


  # ============================================================
  # AGENT 02 — REPOSITORY AUDITOR
  # ============================================================

  repository-auditor:
    name: "02 • Repository Auditor"
    needs: orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      csproj_count: ${{ steps.scan.outputs.csproj_count }}
      workflow_valid: ${{ steps.scan.outputs.workflow_valid }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit repository
        id: scan
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p artifacts/audit

          find . \
            -type f \
            -not -path './.git/*' \
            | sort > artifacts/audit/files.txt

          find . \
            -type f \
            -name '*.csproj' -o -name '*.sln' -o -name '*.slnx' \
            -not -path './.git/*' \
            | sort > artifacts/audit/dotnet-projects.txt

          COUNT="$(grep -c . artifacts/audit/dotnet-projects.txt || true)"
          echo "csproj_count=$COUNT" >> "$GITHUB_OUTPUT"

          YAML_ERRORS=0

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue

            if grep -qE '^name:|^on:|^jobs:' "$file"; then
              if ! ruby -e 'require "yaml"; YAML.load_file(ARGV[0])' "$file" >/dev/null 2>&1; then
                echo "Invalid YAML: $file" >> artifacts/audit/yaml-errors.txt
                YAML_ERRORS=$((YAML_ERRORS + 1))
              fi
            fi
          done < <(find .github/workflows -type f -name '*.yml' -o -name '*.yaml' 2>/dev/null || true)

          if (( YAML_ERRORS == 0 )); then
            echo "workflow_valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflow_valid=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: agent-02-repository-audit
          path: artifacts/audit/


  # ============================================================
  # AGENT 03 — WORKFLOW DEBUGGER
  # ============================================================

  workflow-debugger:
    name: "03 • Workflow Debugger"
    needs: repository-auditor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze workflows
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p artifacts/workflow

          find .github/workflows \
            -type f \
            -name '*.yml' -o -name '*.yaml' \
            -print \
            -exec sed -n '1,260p' {} \; \
            > artifacts/workflow/workflows.txt

          {
            echo "Workflow directory:"
            find .github/workflows -maxdepth 1 -type f 2>/dev/null || true
            echo
            echo "Git status:"
            git status --short
          } > artifacts/workflow/report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: agent-03-workflow-debug
          path: artifacts/workflow/


  # ============================================================
  # AGENT 04 — BUILD AGENT
  # ============================================================

  build-agent:
    name: "04 • Build Agent"
    needs:
      - repository-auditor
      - workflow-debugger
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Discover projects
        shell: bash
        run: |
          set -Eeuo pipefail

          find . \
            -type f \
            -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' \
            -not -path './.git/*' \
            | sort > projects.txt

          test -s projects.txt

      - name: Restore
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r project; do
            [[ -n "$project" ]] || continue
            dotnet restore "$project"
          done < projects.txt

      - name: Build
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r project; do
            [[ -n "$project" ]] || continue

            dotnet build "$project" \
              --configuration "$CONFIGURATION" \
              --no-restore \
              --nologo \
              --verbosity minimal
          done < projects.txt

      - uses: actions/upload-artifact@v4
        with:
          name: agent-04-build
          path: |
            projects.txt
            **/bin/
            **/obj/
          if-no-files-found: warn


  # ============================================================
  # AGENT 05 — TEST AGENT
  # ============================================================

  test-agent:
    name: "05 • Test Agent"
    needs: build-agent
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Discover tests
        shell: bash
        run: |
          set -Eeuo pipefail

          find . \
            -type f \
            -name '*.csproj' \
            -not -path './.git/*' \
            | grep -Ei 'test|tests' \
            | sort -u > tests.txt || true

      - name: Execute tests
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s tests.txt ]]; then
            echo "::warning::No test project detected."
            exit 0
          fi

          while IFS= read -r project; do
            [[ -n "$project" ]] || continue

            dotnet test "$project" \
              --configuration "$CONFIGURATION" \
              --no-restore \
              --nologo \
              --verbosity normal \
              --logger "trx;LogFileName=test-results.trx"
          done < tests.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-05-tests
          path: |
            tests.txt
            **/*.trx
          if-no-files-found: warn


  # ============================================================
  # AGENT 06 — SECURITY AGENT
  # ============================================================

  security-agent:
    name: "06 • Security Agent"
    needs: build-agent
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Credential scan
        shell: bash
        run: |
          set -Eeuo pipefail

          if git grep -n -I -E \
            'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          then
            echo "::error::Potential credential material detected."
            exit 1
          fi

      - name: Dangerous artifact scan
        shell: bash
        run: |
          set -Eeuo pipefail

          if find . \
            -type f \
            -name '*.pfx' -o -name '*.p12' -o -name '*.pem' -o -name '*.key' \
            -not -path './.git/*' \
            | grep -q .
          then
            echo "::error::Potential private-key artifact detected."
            exit 1
          fi

      - name: Git integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code


  # ============================================================
  # AGENT 07 — STATIC REVIEWER
  # ============================================================

  static-reviewer:
    name: "07 • Static Reviewer"
    needs:
      - build-agent
      - test-agent
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Compile diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p artifacts/review

          find . \
            -type f \
            -name '*.cs' -o -name '*.csproj' \
            -not -path './.git/*' \
            | sort > artifacts/review/source-files.txt

          grep -RniE \
            'TODO|FIXME|HACK|NotImplementedException|throw new Exception' \
            --include='*.cs' \
            . > artifacts/review/warnings.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: agent-07-static-review
          path: artifacts/review/


  # ============================================================
  # AGENT 08 — CONTROLLED REPAIR AGENT
  # ============================================================

  repair-agent:
    name: "08 • Controlled Repair Agent"
    needs:
      - build-agent
      - test-agent
      - security-agent
      - static-reviewer
    if: |
      always() &&
      needs.security-agent.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.repair == true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create repair boundary
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p artifacts/repair

          cat > artifacts/repair/REPAIR_POLICY.txt <<'EOF'
          KHALED CONTROLLED REPAIR POLICY

          Allowed:
          - .cs
          - .csproj
          - .sln
          - .slnx
          - .github/workflows/*.yml
          - .github/workflows/*.yaml

          Forbidden:
          - secrets
          - credentials
          - deployment credentials
          - GitHub organization settings
          - repository permissions
          - destructive filesystem operations
          - arbitrary network services
          - persistence mechanisms
          EOF

      - name: Detect repair candidates
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "Repair candidates:"
            grep -RniE \
              'TODO|FIXME|HACK|NotImplementedException|throw new Exception' \
              --include='*.cs' \
              . || true

            echo
            echo "Workflow files:"
            find .github/workflows \
              -type f \
              -name '*.yml' -o -name '*.yaml' \
              -print 2>/dev/null || true
          } > artifacts/repair/candidates.txt

      - uses: actions/upload-artifact@v4
        with:
          name: agent-08-repair-analysis
          path: artifacts/repair/


  # ============================================================
  # AGENT 09 — BROWSER / INTEGRATION VERIFIER
  # ============================================================

  browser-verifier:
    name: "09 • Integration Verifier"
    needs:
      - build-agent
      - test-agent
    if: always() && needs.build-agent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Verify project structure
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p artifacts/integration

          {
            echo "Integration verification"
            echo "========================="
            echo

            echo "Workflows:"
            find .github/workflows \
              -maxdepth 1 \
              -type f \
              -print 2>/dev/null || true

            echo
            echo "Source:"
            find . \
              -type f \
              -name '*.cs' -o -name '*.csproj' \
              -not -path './.git/*' \
              | sort
          } > artifacts/integration/report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: agent-09-integration
          path: artifacts/integration/


  # ============================================================
  # AGENT 10 — FINAL VERIFICATION GATE
  # ============================================================

  verification-agent:
    name: "10 • Final Verification Gate"
    needs:
      - orchestrator
      - repository-auditor
      - workflow-debugger
      - build-agent
      - test-agent
      - security-agent
      - static-reviewer
      - browser-verifier
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Evaluate evidence
        shell: bash
        run: |
          set -Eeuo pipefail

          declare -A RESULTS=(
            [orchestrator]="${{ needs.orchestrator.result }}"
            [repository-auditor]="${{ needs.repository-auditor.result }}"
            [workflow-debugger]="${{ needs.workflow-debugger.result }}"
            [build-agent]="${{ needs.build-agent.result }}"
            [test-agent]="${{ needs.test-agent.result }}"
            [security-agent]="${{ needs.security-agent.result }}"
            [static-reviewer]="${{ needs.static-reviewer.result }}"
            [browser-verifier]="${{ needs.browser-verifier.result }}"
          )

          FAILED=0

          for JOB in "${!RESULTS[@]}"; do
            echo "${JOB}=${RESULTS[$JOB]}"

            case "${RESULTS[$JOB]}" in
              success|skipped)
                ;;
              *)
                FAILED=1
                ;;
            esac
          done

          mkdir -p artifacts/final

          {
            echo "KHALED FACTORY FINAL REPORT"
            echo "==========================="
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_RUN_ID}"
            echo
            for JOB in "${!RESULTS[@]}"; do
              echo "${JOB}: ${RESULTS[$JOB]}"
            done
          } > artifacts/final/report.txt

          if (( FAILED != 0 )); then
            echo "FINAL_STATUS=FAIL" >> artifacts/final/report.txt
            echo "::error::KHALED Factory verification gate FAILED."
            exit 1
          fi

          echo "FINAL_STATUS=PASS" >> artifacts/final/report.txt
          echo "KHALED Factory verification gate PASSED."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KHALED-FINAL-EVIDENCE-${{ github.run_id }}
          path: artifacts/final/
          if-no-files-found: error
