outputs:
  csproj_count: ${{ steps.scan.outputs.csproj_count }}
  workflow_valid: ${{ steps.scan.outputs.workflow_valid }}

steps:
  - uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Audit repository
    id: scan
    shell: bash
    run: |
      set -Eeuo pipefail

      mkdir -p artifacts/audit

      find . \
        -type f \
        -not -path './.git/*' \
        | sort > artifacts/audit/files.txt

      find . \
        -type f \
        -name '*.csproj' -o -name '*.sln' -o -name '*.slnx' \
        -not -path './.git/*' \
        | sort > artifacts/audit/dotnet-projects.txt

      COUNT="$(grep -c . artifacts/audit/dotnet-projects.txt || true)"
      echo "csproj_count=$COUNT" >> "$GITHUB_OUTPUT"

      YAML_ERRORS=0

      while IFS= read -r file; do
        [[ -n "$file" ]] || continue

        if grep -qE '^name:|^on:|^jobs:' "$file"; then
          if ! ruby -e 'require "yaml"; YAML.load_file(ARGV[0])' "$file" >/dev/null 2>&1; then
            echo "Invalid YAML: $file" >> artifacts/audit/yaml-errors.txt
            YAML_ERRORS=$((YAML_ERRORS + 1))
          fi
        fi
      done < <(find .github/workflows -type f -name '*.yml' -o -name '*.yaml' 2>/dev/null || true)

      if (( YAML_ERRORS == 0 )); then
        echo "workflow_valid=true" >> "$GITHUB_OUTPUT"
      else
        echo "workflow_valid=false" >> "$GITHUB_OUTPUT"
      fi

  - uses: actions/upload-artifact@v4
    with:
      name: agent-02-repository-audit
      path: artifacts/audit/

