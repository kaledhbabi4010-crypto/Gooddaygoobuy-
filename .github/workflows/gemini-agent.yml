permissions:
  contents: write
  actions: write

concurrency:
  group: gemini-self-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_WORKFLOW_PAT }}

      - name: Git identity
        run: |
          git config user.name "Gemini Self Repair"
          git config user.email "gemini-self-repair@users.noreply.github.com"

      - name: Gemini Self Repair
        uses: google-github-actions/run-gemini-cli@v0
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GH_WORKFLOW_PAT }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: "0.58.0"
          prompt: |
            SELF-REPAIR ONLY.

            Repair and stabilize the Gemini GitHub Actions infrastructure.

            Inspect all .github/workflows files, GEMINI.md,
            KHALED-MASTER-PLAN.md and git history.

            You may repair workflow files and commit/push the repair.

            Do NOT develop KHALED or REVO AI.
            Do NOT modify application functionality.

            Validate YAML and inspect git diff before committing.

            Never fabricate verification.

            Final status must be:
            VERIFIED / FAILED / NOT_VERIFIED / BLOCKED.
