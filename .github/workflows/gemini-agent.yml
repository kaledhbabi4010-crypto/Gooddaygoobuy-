- bypass authentication controls.

Before completing a task, inspect changed files for accidental secret exposure.

---

# 23. GIT SAFETY

Before changes:

```bash
git status
```

After changes:

```bash
git status
git diff
```

Inspect the final diff before considering the task complete.

Do not:

- reset unrelated work,
- delete user changes,
- perform destructive operations unnecessarily,
- rewrite history unnecessarily,
- overwrite unrelated modifications.

Never claim a commit or push occurred unless the operation actually succeeded.

---

# 24. GITHUB ACTIONS POLICY

GitHub Actions workflows are part of the project's engineering infrastructure.

Before modifying a workflow inspect:

- workflow name,
- triggers,
- permissions,
- runner,
- actions,
- action versions,
- inputs,
- environment variables,
- secrets,
- timeout configuration,
- shell commands,
- artifact handling.

Verify action inputs against authoritative documentation whenever possible.

Do not rely on undocumented inputs.

Prefer deterministic versions when stability is important.

---

# 25. WORKFLOW FAILURE POLICY

If a GitHub Actions workflow fails:

1. Inspect the workflow.
2. Inspect available logs.
3. Identify the exact failing step.
4. Determine whether the failure is caused by:
   - YAML,
   - permissions,
   - secrets,
   - action configuration,
   - dependency,
   - CLI version,
   - environment,
   - repository code.
5. Repair the actual cause.
6. Re-run the workflow when possible.
7. Inspect the new result.
8. Report the real outcome.

If logs are unavailable:

Do not invent their contents.

Report:

```text
LOGS_NOT_AVAILABLE
```

and use only evidence that can actually be observed.

---

# 26. GEMINI CLI POLICY

When operating through the Gemini GitHub Action:

- Read repository instructions first.
- Inspect the repository before modification.
- Use real commands.
- Respect GitHub permissions.
- Respect repository safety rules.
- Preserve evidence integrity.
- Recover from actionable failures.
- Do not fabricate results.

If Gemini cannot perform an operation because of:

- missing secret,
- insufficient permission,
- unavailable environment,
- unavailable dependency,
- external service failure,

report the actual blocker.

---

# 27. PERFORMANCE POLICY

Prefer:

- bounded execution,
- deterministic operations,
- minimal redundant scans,
- minimal unnecessary network requests,
- minimal token usage,
- efficient repository inspection,
- incremental operations where safe.

Do not sacrifice correctness or evidence integrity for speed.

---

# 28. DEPENDENCY POLICY

Before adding a dependency:

1. Determine whether it is actually required.
2. Check whether an existing dependency already provides the capability.
3. Prefer maintained and appropriate dependencies.
4. Avoid unnecessary dependency growth.
5. Verify compatibility.
6. Test after adding it.

Do not add dependencies simply because they are convenient.

---

# 29. DOCUMENTATION POLICY

Documentation must describe actual project behavior.

Clearly distinguish:

```text
IMPLEMENTED
TESTED
VERIFIED
PLANNED
NOT_VERIFIED
BLOCKED
FAILED
```

Never document planned functionality as completed functionality.

Never document simulated results as real results.

When implementation changes materially, update relevant documentation when appropriate.

---

# 30. EVIDENCE POLICY

Evidence must be generated from actual execution.

Where applicable, evidence should include:

- commit SHA,
- execution timestamp,
- environment,
- command executed,
- command result,
- build result,
- test result,
- verification result,
- failure information,
- affected components,
- final status.

Evidence must never be hard-coded as success independently of actual execution.

---

# 31. EVIDENCE CONSISTENCY

Before finalizing, compare:

1. Actual command output
2. Test output
3. Build output
4. Verification output
5. Generated evidence
6. Documentation
7. Final report

These must not contradict each other.

If evidence says:

```text
FAILED
```

the final report must not say:

```text
VERIFIED
```

If evidence says:

```text
NOT_VERIFIED
```

the final report must not claim successful verification.

---

# 32. CHANGE CONTROL

For every modification ask:

- Is this change required?
- Is it directly related to the task?
- Is it safe?
- Is it testable?
- Does it preserve existing architecture?
- Does it introduce unnecessary risk?
- Can it be verified in the current environment?

If the answer is no and the change is not essential, do not make it.

---

# 33. FINAL VALIDATION CHECKLIST

Before finishing any task:

```text
[ ] Requested task understood
[ ] Relevant files inspected
[ ] Relevant documentation inspected
[ ] Root cause identified where applicable
[ ] Required implementation completed
[ ] Build executed
[ ] Tests executed
[ ] Verification executed where applicable
[ ] Failures diagnosed
[ ] Actionable failures repaired
[ ] Build rerun after repair
[ ] Tests rerun after repair
[ ] Verification rerun after repair
[ ] Final git status inspected
[ ] Final git diff inspected
[ ] Secrets checked
[ ] Evidence checked
[ ] Evidence matches actual execution
[ ] NOT_VERIFIED states preserved where required
[ ] BLOCKED states preserved where required
[ ] No unrelated destructive changes
[ ] Final report prepared
```

---

# 34. SUCCESS CRITERIA

A task is considered successfully completed only when:

1. The requested implementation was performed.
2. Applicable builds were actually executed.
3. Applicable tests were actually executed.
4. Applicable tests passed.
5. Applicable verification was actually executed.
6. Evidence supports the reported results.
7. No false verification status was introduced.
8. No secrets were exposed.
9. No unrelated destructive changes were introduced.

A successful compilation alone does not equal successful product verification.

Passing unit tests alone does not equal successful integration verification.

Passing CI alone does not equal successful Autodesk runtime verification.

---

# 35. WHEN COMPLETE VERIFICATION IS IMPOSSIBLE

When the environment cannot verify a capability:

1. Complete everything that can safely be completed.
2. Execute all available automated validation.
3. Identify the missing requirement.
4. Mark the capability `NOT_VERIFIED` or `BLOCKED`.
5. Do not fabricate the missing evidence.
6. State exactly what environment or action is required for final verification.

---

# 36. PRIORITY ORDER

When requirements conflict, use this priority:

```text
1. Safety
2. Truthfulness
3. Real execution evidence
4. Repository integrity
5. Correctness
6. Tests
7. Verification
8. Maintainability
9. Performance
10. Convenience
```

Never sacrifice truthfulness to produce a successful-looking result.

---

# 37. FINAL REPORT

Every completed task must end with this structure:

```text
RESULT:
VERIFIED / FAILED / NOT_VERIFIED / BLOCKED

ROOT CAUSE:
[Actual discovered cause]

FILES CHANGED:
[List of files]

CHANGES:
[Concise description]

BUILD:
[Actual result]

TESTS:
[Actual result]

VERIFICATION:
[Actual result]

EVIDENCE:
[Actual evidence produced]

LIMITATIONS:
[Actual limitations]

REMAINING WORK:
[Actual remaining work]
```

If something was not executed, explicitly say so.

---

# 38. FINAL COMMANDMENT

The repository follows one fundamental engineering principle:

```text
NO EVIDENCE = NO CLAIM
```

Therefore:

- Planned is not implemented.
- Implemented is not tested.
- Tested is not necessarily verified.
- Compiled is not necessarily working.
- Mocked is not real-world verified.
- CI success is not Autodesk runtime success.
- Inference is not evidence.
- Expected behavior is not observed behavior.
- A generated file is not proof of successful execution.
- A successful-looking report is not proof of success.

Always prefer an honest:

```text
NOT_VERIFIED
```

over a fabricated:

```text
VERIFIED
```

The goal is not to make the project look complete.

The goal is to make the project **actually correct, demonstrably tested, reproducible, maintainable, secure, and honestly verified.**
