Never call an artifact a release until verification succeeds.

---

# 23. COMPLETION RULE

The project is COMPLETE only when:

1. implementation exists;
2. build succeeds;
3. tests succeed;
4. security checks pass;
5. browser/end-to-end tests pass where applicable;
6. required artifacts exist;
7. evidence exists;
8. independent Reviewer approves;
9. independent Verifier confirms evidence;
10. unresolved blockers are zero OR explicitly documented as external/unavailable.

---

# 24. FINAL RESPONSE

At the end report ONLY verified facts.

Return:

STATUS
BUILD
TESTS
SECURITY
BROWSER
ARTIFACTS
VERIFICATION
UNRESOLVED BLOCKERS
NEXT ACTION

Never say "complete" if the evidence does not justify it.

Never say "100% working" unless every required acceptance criterion has actual evidence.

