name: AI Code Reviewer Multi-LLM

on:
  push:
    branches:
      - khaled-gemini-direct-fix
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Code Reviewer - Multi-LLM
        uses: mara-werils/ai-code-reviewer@v0.4.0
        with:
          provider: groq
          model: llama-3.3-70b-versatile
          review_style: thorough
          max_comments: "20"
          suggest_tests: "true"
          custom_instructions: |
            Inspect the real repository and the actual changes.
            Identify real bugs and build/test problems.
            Do not fabricate results.
            Focus on actionable fixes.
            This repository is being repaired on branch:
            khaled-gemini-direct-fix
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
