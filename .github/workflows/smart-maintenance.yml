import os
import sys
import requests
import base64
import re
import time
from datetime import datetime
from groq import Groq

def silent_exit():
    sys.exit(0)

# قراءة المتغيرات
groq_key = os.environ.get('GROQ_API_KEY', '').strip()
token = os.environ.get('GITHUB_TOKEN', '').strip()
repo = os.environ.get('GITHUB_REPOSITORY', '').strip()
branch = os.environ.get('GITHUB_REF_NAME', 'main').strip()

if not groq_key or not token:
    silent_exit()

headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}

# 1. جلب قائمة الملفات المتغيرة مؤخراً
def get_recent_files():
    try:
        # آخر 10 commits
        commits_url = f"https://api.github.com/repos/{repo}/commits?per_page=10"
        res = requests.get(commits_url, headers=headers, timeout=30)
        if res.status_code != 200:
            return []
        
        commits = res.json()
        files = set()
        
        for commit in commits:
            sha = commit['sha']
            commit_url = f"https://api.github.com/repos/{repo}/commits/{sha}"
            commit_res = requests.get(commit_url, headers=headers, timeout=30)
            if commit_res.status_code == 200:
                commit_data = commit_res.json()
                for file in commit_data.get('files', []):
                    if file['status'] in ['modified', 'added']:
                        files.add(file['filename'])
        
        return list(files)[:5]  # أول 5 ملفات فقط
    except:
        return []

# 2. فحص الملف بحثاً عن أخطاء شائعة
def check_file_errors(content, filename):
    errors = []
    
    # ملفات Python
    if filename.endswith('.py'):
        # تحقق من syntax بسيط
        if 'def ' in content and ':' not in content:
            errors.append("قد تكون هناك مشكلة في تعريف الدوال")
        if 'import ' in content and 'from' not in content and 'import' not in content.split('\n')[0]:
            errors.append("قد تكون الاستيرادات في المكان الخطأ")
    
    # ملفات Markdown
    elif filename.endswith('.md'):
        if content.count('#') == 0:
            errors.append("لا توجد عناوين في الملف")
    
    # ملفات JSON
    elif filename.endswith('.json'):
        try:
            import json
            json.loads(content)
        except:
            errors.append("خطأ في تنسيق JSON")
    
    # ملفات YAML
    elif filename.endswith('.yml') or filename.endswith('.yaml'):
        if content.count(':') == 0:
            errors.append("قد يكون هناك مشكلة في تنسيق YAML")
    
    return errors

# 3. محاولة إصلاح الملف
def try_fix_file(client, filename, content, errors):
    prompt = f"""أنت خبير في إصلاح الملفات والأكواد.

الملف: {filename}
الأخطاء المكتشفة: {', '.join(errors) if errors else 'لا توجد أخطاء واضحة، لكن راجع الملف وحسّنه'}

المحتوى الحالي:
---
{content}
---

المطلوب:
1. راجع الملف بعناية
2. أصلح أي أخطاء أو مشاكل
3. حسّن الجودة إذا أمكن
4. أعد الملف كاملاً بعد التعديل فقط
5. لا تضف أي شروحات خارج الملف"""

    models = [
        "llama-3.3-70b-versatile",
        "llama-3.1-70b-versatile",
        "llama-3.1-8b-instant"
    ]
    
    for model in models:
        try:
            response = client.chat.completions.create(
                model=model,
                messages=[{"role": "user", "content": prompt}],
                temperature=0.2,
                max_tokens=4096
            )
            return response.choices[0].message.content.strip()
        except:
            continue
    
    return None

# 4. حفظ الملف المصحح
def save_file(filename, content, sha):
    try:
        # تنظيف من علامات الكود
        if content.startswith("```"):
            lines = content.split("\n")
            if lines[-1].strip() == "```":
                lines = lines[1:-1]
            else:
                lines = lines[1:]
            content = "\n".join(lines).strip()
        
        update_url = f"https://api.github.com/repos/{repo}/contents/{filename}"
        encoded = base64.b64encode(content.encode("utf-8")).decode("utf-8")
        
        put_res = requests.put(update_url, headers=headers, json={
            "message": f"🤖 إصلاح تلقائي [skip ci]",
            "content": encoded,
            "sha": sha,
            "branch": branch
        }, timeout=30)
        
        return put_res.status_code in [200, 201]
    except:
        return False

# --- التنفيذ الرئيسي ---

# جلب الملفات المتغيرة
recent_files = get_recent_files()

if not recent_files:
    silent_exit()

# تهيئة Groq
try:
    client = Groq(api_key=groq_key)
except:
    silent_exit()

fixed_count = 0
fixed_files = []

# فحص وإصلاح كل ملف
for filename in recent_files:
    try:
        # قراءة الملف
        file_url = f"https://api.github.com/repos/{repo}/contents/{filename}?ref={branch}"
        res = requests.get(file_url, headers=headers, timeout=30)
        
        if res.status_code != 200:
            continue
        
        data = res.json()
        content = base64.b64decode(data["content"]).decode("utf-8")
        sha = data["sha"]
        
        # فحص الأخطاء
        errors = check_file_errors(content, filename)
        
        # محاولة الإصلاح
        fixed_content = try_fix_file(client, filename, content, errors)
        
        if fixed_content and fixed_content != content:
            if save_file(filename, fixed_content, sha):
                fixed_count += 1
                fixed_files.append(filename)
                time.sleep(1)  # انتظار بسيط بين الملفات
    
    except:
        continue

# حفظ تقرير إذا تم إصلاح أي شيء
if fixed_count > 0:
    report = f"""# ✅ تم الإصلاح التلقائي

**التاريخ:** {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}

## الملفات التي تم إصلاحها ({fixed_count})
{chr(10).join(['- ' + f for f in fixed_files])}

---
*تم بواسطة نظام الإصلاح التلقائي*
"""
    
    report_path = "AUTO_FIX_REPORT.md"
    report_url = f"https://api.github.com/repos/{repo}/contents/{report_path}"
    
    try:
        check_report = requests.get(report_url, headers=headers, timeout=30)
        report_sha = None
        if check_report.status_code == 200:
            report_sha = check_report.json().get("sha")
        
        report_data = {
            "message": "✅ إصلاح تلقائي [skip ci]",
            "content": base64.b64encode(report.encode("utf-8")).decode("utf-8"),
            "branch": branch
        }
        if report_sha:
            report_data["sha"] = report_sha
        
        requests.put(report_url, headers=headers, json=report_data, timeout=30)
    except:
        pass

silent_exit()
