
name: KHALED AI - Real App Test & Repair

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Build application
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "NO_GRADLE_PROJECT_FOUND"
            exit 1
          fi

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb devices
            APK=$(find . -name "*.apk" | head -1)
            test -n "$APK"
            adb install -r "$APK"
            adb shell monkey -p "$(aapt dump badging "$APK" | sed -n "s/package: name='[^']*'.*/\1/p")" 1
            sleep 10
            adb shell dumpsys activity activities > emulator_activity.txt
            adb logcat -d > emulator_logcat.txt

      - name: AI Code Reviewer
        uses: mara-werils/ai-code-reviewer@v0.4.0
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Evidence
        if: always()
        run: |
          echo "===== BUILD / TEST EVIDENCE ====="
          find . -name "*.apk" -type f -print
          test -f emulator_logcat.txt && tail -200 emulator_logcat.txt || true
          test -f emulator_activity.txt && tail -100 emulator_activity.txt || true
