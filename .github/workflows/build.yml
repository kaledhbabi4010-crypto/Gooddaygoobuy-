أنت الآن وكيل التنفيذ الفعلي للمستودع، وليس مجرد مدقق أو مولّد مثال.

اقرأ KHALED-MASTER-PLAN.md كاملًا، ثم نفّذ المشروع الحقيقي بالكامل داخل المستودع.

لا تكتفِ بإنشاء Bootstrap أو Console أو ملفات وهمية.
لا تقل "تم" إلا بعد وجود الكود الحقيقي.

نفّذ بالترتيب:
1. أنشئ كل بنية KHALED وREVO AI المطلوبة في الخطة.
2. أنشئ جميع المشاريع والكود والاختبارات والملفات اللازمة.
3. ابنِ المشروع فعليًا على Windows.
4. شغّل الاختبارات الفعلية.
5. عند أي خطأ، اقرأ الخطأ الحقيقي وأصلح السبب ثم أعد Build/Test.
6. كرر الإصلاح حتى النجاح، دون حذف المتطلبات أو تعطيل الاختبارات.
7. أنشئ ملفات Release وVerification وSHA256.
8. افحص كل متطلبات KHALED-MASTER-PLAN.md مقابل التنفيذ.
9. لا تدّعِ دعم Revit/AutoCAD لأي إصدار إلا إذا كان هناك دليل بناء/اختبار حقيقي.
10. إذا كانت هناك قدرة لا يمكن تنفيذها أو اختبارها بسبب عدم توفر SDK/بيئة Autodesk، اذكرها صراحة ولا تستبدلها بمحاكاة.

ممنوع:
- Demo
- Placeholder
- Fake success
- Simulated tests
- تجاهل الأخطاء
- حذف الاختبارات
- الادعاء بأن المنتج كامل بدون دليل

الشرط النهائي:
لا تعتبر المهمة ناجحة إلا إذا كان الكود الحقيقي موجودًا، Build ناجحًا، Tests ناجحة، Verification ناجحًا، وجميع الملفات المطلوبة موجودة.

ابدأ الآن من حالة المستودع الحالية، ولا تطلب مني خطوات إضافية؛ نفّذ كل ما تستطيع فعليًا وسجّل أي عائق حقيقي بدل اختلاق النجاح.
