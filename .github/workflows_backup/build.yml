name: KHALED Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: khaled-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test, Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Validate plan
        run: bash scripts/validate-plan.sh

      - name: Bootstrap
        run: bash scripts/bootstrap.sh

      - name: Discover environment
        run: bash scripts/discover.sh

      - name: Restore
        run: dotnet restore KHALED.sln

      - name: Build
        run: bash scripts/build.sh

      - name: Test
        run: bash scripts/test.sh

      - name: Verify
        run: bash scripts/verify.sh

      - name: Diagnose
        if: always()
        run: bash scripts/diagnose.sh

      - name: Evidence
        if: always()
        run: bash scripts/evidence.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khaled-evidence
          path: evidence/
          retention-days: 7
