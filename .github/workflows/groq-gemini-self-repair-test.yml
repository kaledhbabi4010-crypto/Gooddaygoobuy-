name: KHALED - Groq Gemini Self Repair Test

on:
  push:
    branches:
      - groq-real-repair-test
      - main
    paths:
      - '.github/workflows/gemini-invoke.yml'
      - '.github/workflows/groq-gemini-self-repair-test.yml'
      - '.github/scripts/smart_maintenance.py'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  surgical-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Groq SDK
        run: python -m pip install --disable-pip-version-check groq

      - name: Precheck target file
        id: precheck
        run: |
          set -euo pipefail
          TARGET=".github/workflows/gemini-invoke.yml"
          test -f "$TARGET"
          if grep -q "name:" "$TARGET" && grep -q "on:" "$TARGET" && grep -q "jobs:" "$TARGET"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "TARGET ALREADY VALID - no repair needed"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "TARGET INVALID - repair required"
          fi

      - name: Run Groq surgical repair
        if: steps.precheck.outputs.valid == 'false'
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          python3 .github/scripts/smart_maintenance.py \
          "Repair ONLY .github/workflows/gemini-invoke.yml.

          Evidence: the file is missing the required GitHub Actions keys
          name:, on:, and jobs:, so it is not a valid workflow.

          Use repository evidence to determine the smallest justified repair:
          turn it into a minimal valid GitHub Actions workflow with
          name, on, and jobs keys.

          Modify ONLY .github/workflows/gemini-invoke.yml.
          Do NOT modify any other file.
          Do NOT rebuild the project.
          Do NOT run the full test suite.
          Do NOT refactor or clean unrelated code.
          Report VERIFIED_FIXED only with actual evidence.
          Otherwise report UNABLE_TO_VERIFY."

      - name: Verify only target changed
        id: verify
        if: always() && steps.precheck.outputs.valid == 'false'
        run: |
          set -euo pipefail
          echo "=== GIT STATUS ==="
          git status --short -- . ':!.groq-repair/'
          echo "=== TARGET DIFF ==="
          git diff -- ".github/workflows/gemini-invoke.yml"

          OTHER=$(git status --porcelain -- . ':!.groq-repair/' | grep -v "gemini-invoke.yml" || true)

          if [ -n "$OTHER" ]; then
            echo "ERROR: OTHER FILES MODIFIED"
            echo "$OTHER"
            exit 50
          fi

      - name: Commit and push repair
        if: always() && steps.precheck.outputs.valid == 'false' && steps.verify.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- . ':!.groq-repair/')" ]; then
            echo "NOTHING_TO_COMMIT"
            exit 0
          fi
          git config user.name "groq-repair-bot"
          git config user.email "actions@github.com"
          git checkout - 2>/dev/null || true
          git add -- ".github/workflows/gemini-invoke.yml"
          git commit -m "fix: auto-repair gemini-invoke.yml [skip ci]"
          git push

      - name: Targeted validation
        if: always()
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import sys

          path = ".github/workflows/gemini-invoke.yml"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          print("TARGET:", path)
          print("SIZE:", len(text), "bytes")

          missing = [
              x for x in ["name:", "on:", "jobs:"]
              if x not in text
          ]

          if missing:
              print("MISSING:", missing)
              print("TARGETED_VALIDATION=FAILED")
              sys.exit(51)

          print("TARGETED_VALIDATION=BASIC_STRUCTURE_PRESENT")
          PY

      - name: Final evidence
        if: always()
        run: |
          echo "BUILD=NOT_RUN"
          echo "FULL_TEST_SUITE=NOT_RUN"
          echo "TARGET=.github/workflows/gemini-invoke.yml"
