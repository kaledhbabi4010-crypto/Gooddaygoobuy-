name: صيانة الملفات بـ Groq AI

# هذا السطر يجعل العملية تعمل يدوياً بضغطة زر فقط
on:
  workflow_dispatch:
    inputs:
      file_path:
        description: 'اسم الملف المراد صيانته (مثال: README.md أو index.html)'
        required: true
        default: 'README.md'
      instruction:
        description: 'ما الذي تريد فعله؟ (مثال: اصلح الأخطاء الإملائية، أو نظم التنسيق)'
        required: true
        default: 'قم بمراجعة الملف، إصلاح الأخطاء الإملائية، وتحسين التنسيق ليكون احترافياً.'

jobs:
  maintain-file:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ملفات المستودع
        uses: actions/checkout@v4

      - name: تثبيت أدوات Python البسيطة
        run: pip install groq requests

      - name: تشغيل أداة الصيانة الذكية
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE_TO_FIX: ${{ github.event.inputs.file_path }}
          USER_INSTRUCTION: ${{ github.event.inputs.instruction }}
        run: |
          python3 -c "
          import os, requests, base64
          from groq import Groq

          file_path = os.environ['FILE_TO_FIX']
          instruction = os.environ['USER_INSTRUCTION']
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          branch = os.environ['GITHUB_REF_NAME']

          # 1. قراءة محتوى الملف الحالي
          url = f'https://api.github.com/repos/{repo}/contents/{file_path}?ref={branch}'
          res = requests.get(url, headers={'Authorization': f'token {token}'})
          data = res.json()
          current_content = base64.b64decode(data['content']).decode('utf-8')
          file_sha = data['sha']

          # 2. إرسال الملف إلى Groq للإصلاح
          client = Groq(api_key=os.environ['GROQ_API_KEY'])
          prompt = f'الملف الحالي:\n{current_content}\n\nالمطلوب: {instruction}\nأعد كتابة الملف كاملاً بعد الإصلاح فقط، بدون أي شروحات أو كلام إضافي.'
          
          response = client.chat.completions.create(
              model='llama-3.3-70b-versatile',
              messages=[{'role': 'user', 'content': prompt}],
              temperature=0.1
          )
          
          # تنظيف الرد لاستخراج الكود فقط
          new_content = response.choices[0].message.content
          if '```' in new_content:
              new_content = new_content.split('```')[1]
              if new_content.startswith('python') or new_content.startswith('md'):
                  new_content = new_content.split('\n', 1)[1]
              new_content = new_content.rsplit('```', 1)[0].strip()

          # 3. حفظ الملف المصحح في المستودع
          update_url = f'https://api.github.com/repos/{repo}/contents/{file_path}'
          requests.put(update_url, headers={'Authorization': f'token {token}'}, json={
              'message': f'🤖 صيانة تلقائية: {instruction}',
              'content': base64.b64encode(new_content.encode('utf-8')).decode('utf-8'),
              'sha': file_sha,
              'branch': branch
          })
          print('✅ تم حفظ الملف المصحح بنجاح!')
          "
