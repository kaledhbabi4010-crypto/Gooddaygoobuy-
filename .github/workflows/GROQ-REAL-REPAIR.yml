name: GROQ Real Repair Capability

on:
  push:
    branches:
      - groq-real-repair-test

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Groq
        run: |
          python3 -m pip install --disable-pip-version-check groq

      - name: GROQ REAL REPAIR
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -e
          python3 .github/scripts/smart_maintenance.py             "Repair only GROQ_REPAIR_TEST.py. The real Python syntax error is a missing closing parenthesis in the print call inside main(). Fix only this file. Do not modify any other file. Do not build the project. Do not run the full test suite."

      - name: TARGETED VERIFY
        run: |
          python3 -m py_compile GROQ_REPAIR_TEST.py
          echo "TARGETED_PYTHON_VERIFY=PASS"
          echo "BUILD=OFF"
          echo "FULL_TEST=OFF"
          echo "REBUILD=OFF"

      - name: DIFF
        run: |
          git status --short
          git diff -- GROQ_REPAIR_TEST.py
